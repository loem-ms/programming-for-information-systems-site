name: Build and publish the course book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication scope, links and download packages
        run: python scripts/validate.py .
      - name: Build with the Jupyter Book 2 MyST engine
        run: |
          set -o pipefail
          npx --yes mystmd@1.12.0 build --html 2>&1 | tee myst-build.log
      - name: Check the generated site
        run: python scripts/validate.py . --html _build/html --log myst-build.log
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
