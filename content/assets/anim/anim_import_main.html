<!doctype html>

<style>
/* Campus FoodBridge animation player · course/assets/anim/player.css
   Inlined into every page by tools/anim.py. Authoring guide: course/assets/anim/README.md.
   The page fills its window (the site's 5:3 embed box, or a normal browser window) and never scrolls:
   header · panels · caption and controls. Modes (set by player.js on <html data-mode>):
   wide (>= 560 x 300), compact (smaller: one panel at a time, tabs), stacked (narrow and tall). */

:root {
  --bg: #ffffff;
  --fg: #1b1f24;
  --muted: #545d68;
  --panel: #f5f7f9;
  --border: #c9d1d9;
  --accent: #0b57c2;
  --accent-fg: #ffffff;
  --focus: #0b57c2;
  --lit-bg: #fff0b3;
  --lit-edge: #b88a00;
  --flash: #ffd34d;
  --new-bg: #dcf5e3;
  --broken-bg: #fde8e6;
  --token-bg: #e1efff;
  --str: #0a3d8f;
  --num: #0b57c2;
  --const: #7a3fc4;
  --ok: #17703a;
  --error: #b0261b;
  --warn: #7a4f00;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color-scheme: light;
}

:root[lang="km"] {
  --font: "Noto Sans Khmer", "Khmer Sangam MN", "Khmer MN", "Khmer UI", "Khmer OS Battambang", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418;
    --fg: #e8edf2;
    --muted: #a9b2bd;
    --panel: #1a1e24;
    --border: #3a424c;
    --accent: #7cb4ff;
    --accent-fg: #0b1220;
    --focus: #7cb4ff;
    --lit-bg: #4a3a06;
    --lit-edge: #f2c55c;
    --flash: #8a6d10;
    --new-bg: #163a24;
    --broken-bg: #4a1d1a;
    --token-bg: #16304f;
    --str: #a5d6ff;
    --num: #7cb4ff;
    --const: #d2a8ff;
    --ok: #6fd68f;
    --error: #ff9a8f;
    --warn: #f2c55c;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #121418;
  --fg: #e8edf2;
  --muted: #a9b2bd;
  --panel: #1a1e24;
  --border: #3a424c;
  --accent: #7cb4ff;
  --accent-fg: #0b1220;
  --focus: #7cb4ff;
  --lit-bg: #4a3a06;
  --lit-edge: #f2c55c;
  --flash: #8a6d10;
  --new-bg: #163a24;
  --broken-bg: #4a1d1a;
  --token-bg: #16304f;
  --str: #a5d6ff;
  --num: #7cb4ff;
  --const: #d2a8ff;
  --ok: #6fd68f;
  --error: #ff9a8f;
  --warn: #f2c55c;
  color-scheme: dark;
}

/* ---------- page frame: fills the window, never scrolls ---------- */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
}

html {
  font-size: clamp(12px, min(1.85vw, 3.1vh), 17px);
}
html[data-mode="compact"] { font-size: clamp(10px, min(3vw, 5.1vh), 13px); }
html[data-mode="stacked"] { font-size: 14px; }

body {
  font-family: var(--font);
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
:root[lang="km"] body { line-height: 1.6; }

code, .mono { font-family: var(--mono); font-size: 0.95em; }

.anim {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 0.35rem 0.6rem 0.4rem;
  gap: 0.35rem;
}
.anim *, .anim *::before, .anim *::after { box-sizing: border-box; }

/* header: title · tabs (compact) · step n/N · open in a new tab */
.anim-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 1.6rem;
  flex: none;
}
.anim-title {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  font-size: 1.05rem;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.anim-title code { font-size: 0.92em; }
.counter { flex: none; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.pop {
  flex: none;
  display: none;
  color: var(--accent);
  text-decoration: none;
  font-size: 1.05rem;
  line-height: 1;
  padding: 0.1rem 0.25rem;
  border-radius: 4px;
}
.pop:hover { background: var(--panel); }
.pop:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
html[data-embed="1"] .pop { display: inline-block; }

.tabs { display: none; flex: 1 1 auto; min-width: 0; gap: 0.2rem; overflow: hidden; }
.tab {
  font: inherit;
  font-size: 0.8rem;
  line-height: 1.2;
  padding: 0.15rem 0.45rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tab.changed::after { content: " •"; color: var(--warn); }
.tab[aria-selected="true"].changed::after { color: var(--accent-fg); }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- panels ---------- */

.anim-panels {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: 0.5rem;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  min-width: 0;
  min-height: 0;
  flex: 1 1 0;
}
.col.left.code-first { flex: 1.45 1 0; }

.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  flex: 0 1 auto;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  overflow: hidden;
}
.col .panel.grow { flex: 1 1 auto; }
.col > .panel:only-child { flex: 1 1 auto; }
.panel-head {
  display: flex;
  align-items: baseline;
  gap: 0.4rem;
  margin: 0;
  padding: 0.2rem 0.55rem 0.1rem;
  font-size: 0.78rem;
  font-weight: 650;
  letter-spacing: 0.02em;
  color: var(--muted);
  background: none;
  border: 0;
  width: 100%;
  text-align: left;
  font-family: var(--font);
  flex: none;
}
.panel-head .sub { font-family: var(--mono); font-weight: 600; color: var(--fg); letter-spacing: 0; }
.panel-head .sub.prose { font-family: var(--font); }
.panel.collapsed .panel-body { display: none; }
.panel.collapsed .panel-head { cursor: pointer; padding-bottom: 0.2rem; }
.panel.collapsed .panel-head::before { content: "▸"; }
.panel.collapsed.changed .panel-head::after { content: "•"; color: var(--warn); }
.panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  padding: 0.15rem 0.5rem 0.45rem;
  font-size: calc(1rem * var(--scale, 1));
}
.panel-body.scroll { overflow: auto; }
/* A panel that scrolls can be reached with Tab (player.js sets tabindex); the ring shows only for the keyboard. */
.panel-body:focus { outline: none; }
.panel-body:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
/* Content wider than its panel (a long code line) scrolls sideways; never cut off silently: a "→" at the
   right edge says there is more (until the student scrolls to the end), and the scroll bar stays visible
   where the browser lets a page style it (Chrome, Edge, Safari on a computer). */
.more {
  display: none;
  position: absolute;
  right: 0;
  width: 1.9em;
  align-items: center;
  justify-content: flex-end;
  padding-right: 0.2em;
  background: linear-gradient(to right, transparent, var(--panel) 62%);
  color: var(--accent);
  font-family: var(--font);
  font-weight: 800;
  pointer-events: none;
}
.panel.more-right .more { display: flex; }
.panel.hscroll .panel-body::-webkit-scrollbar { width: 7px; height: 7px; }
.panel.hscroll .panel-body::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }
.panel.hscroll .panel-body::-webkit-scrollbar-track, .panel.hscroll .panel-body::-webkit-scrollbar-corner { background: transparent; }
.empty { color: var(--muted); font-style: italic; font-size: 0.9em; }

/* compact: one panel at a time, tabs in the header */
html[data-mode="compact"] .anim-title { display: none; }
html[data-mode="compact"] .tabs { display: flex; }
html[data-mode="compact"] .anim-panels { display: block; }
html[data-mode="compact"] .col { display: contents; }
html[data-mode="compact"] .panel { display: none; height: 100%; }
html[data-mode="compact"] .panel.shown { display: flex; }
html[data-mode="compact"] .panel-head { display: none; }

/* stacked: narrow and tall (a phone, full page): all panels, the panel area scrolls */
html[data-mode="stacked"] .anim-panels { flex-direction: column; overflow-y: auto; }
html[data-mode="stacked"] .col { display: contents; }
html[data-mode="stacked"] .col > .panel { flex: none; order: var(--i, 0); }
html[data-mode="stacked"] .panel-body { overflow-x: auto; }

/* ---------- code ---------- */

.code {
  font-family: var(--mono);
  font-size: 0.92em;
  line-height: 1.42;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0.15rem 0;
}
.code-lines { display: inline-block; min-width: 100%; }
/* A code line too long for the panel (it scrolls sideways): the box grows with the line, so the line
   stays inside the box while the student scrolls. Only then, so code that fits keeps its layout. */
.panel.hscroll .code { width: max-content; min-width: 100%; }
.ln { display: flex; }
.ln .no {
  flex: none;
  width: 2.3em;
  padding-right: 0.7em;
  text-align: right;
  color: var(--muted);
  user-select: none;
}
.ln .src { white-space: pre; padding-right: 0.6em; }
.ln.lit { background: var(--lit-bg); color: var(--lit-fg, var(--fg)); box-shadow: inset 3px 0 0 var(--lit-edge); }
.ln.lit .no { color: var(--fg); font-weight: 700; }

/* ---------- memory ---------- */

.frame {
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  margin-bottom: 0.35rem;
}
.frame:last-child { margin-bottom: 0; }
.frame-head {
  font-size: 0.8em;
  color: var(--muted);
  padding: 0.1rem 0.45rem;
  border-bottom: 1px solid var(--border);
}
.frame-head code { color: var(--fg); }
.frame-tag { margin-left: 0.4em; font-style: italic; }
.frame.fading { border: 2px dashed var(--muted); }
.frame.fading .row, .frame.fading .frame-head { color: var(--muted); }
.frame.fading .row .v-str, .frame.fading .row .v-num, .frame.fading .row .v-const { color: var(--muted); }
.frame-rows { padding: 0.1rem 0; }
.row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  column-gap: 0.4em;
  padding: 0.05rem 0.45rem;
  font-family: var(--mono);
  font-size: 0.9em;
}
.row.lit { background: var(--lit-bg); box-shadow: inset 3px 0 0 var(--lit-edge); }
.row .nm { font-weight: 650; white-space: nowrap; }
.row .arr { color: var(--muted); }
.row .val { min-width: 0; }
.row .old { text-decoration: line-through; color: var(--muted); margin-right: 0.35em; }
.row .note { font-family: var(--font); font-size: 0.85em; color: var(--muted); margin-left: auto; }
.row.ret .nm { font-family: var(--font); font-style: italic; font-weight: 600; }

.row .val, .v-str { white-space: pre-wrap; }   /* text values keep their spaces: "  Dara " */
.v-str { color: var(--str); }
.v-num { color: var(--num); }
.v-const { color: var(--const); font-weight: 600; }
.v-repr { color: var(--muted); font-style: italic; }
.cells { display: inline-flex; flex-wrap: wrap; gap: 0.15em; vertical-align: top; }
.cell { display: inline-flex; flex-direction: column; align-items: center; }
.cell-v { border: 1px solid var(--border); background: var(--panel); padding: 0 0.35em; min-width: 1.6em; text-align: center; border-radius: 3px; }
.cell-i { font-size: 0.75em; color: var(--muted); line-height: 1.1; }
.dict { display: inline-flex; flex-direction: column; border-left: 2px solid var(--border); padding-left: 0.35em; vertical-align: top; }
.drow { display: flex; column-gap: 0.35em; flex-wrap: wrap; }
.drow .arr { color: var(--muted); }
.records { display: inline-flex; flex-direction: column; gap: 0.2em; vertical-align: top; }
.records .dict { border: 1px solid var(--border); border-radius: 4px; padding: 0.05em 0.35em; background: var(--panel); }
.obj { display: inline-flex; flex-direction: column; border: 1.5px solid var(--accent); border-radius: 5px; padding: 0.05em 0.4em 0.15em; vertical-align: top; }
.obj-head { font-size: 0.8em; color: var(--accent); font-weight: 650; }

/* ---------- output ---------- */

.out { font-family: var(--mono); font-size: 0.88em; line-height: 1.38; }
.ol { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 0.3em; border-radius: 3px; }
.ol.error { color: var(--error); }
.ol.ok { color: var(--ok); }
.ol.input { font-weight: 700; }
.ol.input::before { content: "› "; color: var(--muted); }
.ol.lit { background: var(--lit-bg); box-shadow: inset 3px 0 0 var(--lit-edge); }

/* ---------- files ---------- */

.ftree { font-family: var(--mono); font-size: 0.9em; }
.fr {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  column-gap: 0.4em;
  padding: 0.05rem 0.35rem 0.05rem calc(0.35rem + var(--d, 0) * 1.2em);
  border-radius: 4px;
  border: 1px solid transparent;
}
.fr .ficon { font-family: var(--font); }
.fr .fname { font-weight: 600; }
.fr .badge { font-family: var(--font); font-size: 0.78em; padding: 0 0.45em; border-radius: 999px; border: 1px solid currentColor; }
.fr .fnote { font-family: var(--font); font-size: 0.85em; color: var(--muted); }
.fr.st-new { background: var(--new-bg); }
.fr.st-new .badge { color: var(--ok); }
.fr.st-changed { background: var(--lit-bg); }
.fr.st-changed .badge { color: var(--warn); }
.fr.st-same .badge { color: var(--muted); }
.fr.st-gone .fname { text-decoration: line-through; color: var(--muted); }
.fr.st-gone .badge { color: var(--muted); }
.fr.st-temp { border: 1px dashed var(--muted); font-style: italic; }
.fr.st-temp .badge { color: var(--muted); }
.fr.st-broken { background: var(--broken-bg); }
.fr.st-broken .badge { color: var(--error); }
.flines {
  margin: 0.05rem 0 0.2rem calc(0.35rem + (var(--d, 0) + 1) * 1.2em);
  padding: 0.1rem 0.4rem;
  font-family: var(--mono);
  font-size: 0.85em;
  line-height: 1.35;
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--bg);
  border-left: 3px solid var(--border);
}

/* ---------- system ---------- */

.parts {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr));
  gap: 0.9em 1.3em;
  padding: 0.2em 0.1em;
}
.part {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  padding: 0.25em 0.45em 0.3em;
  min-width: 0;
}
.part.lit { border: 2px solid var(--accent); background: var(--lit-bg); }
.part.done { border-color: var(--ok); }
.part.done::after { content: "✓"; position: absolute; top: 0.1em; right: 0.35em; color: var(--ok); font-weight: 800; }
.part-label { font-family: var(--mono); font-weight: 650; font-size: 0.88em; overflow-wrap: break-word; padding-right: 0.8em; }
.part-icon { margin-right: 0.25em; font-family: var(--font); }
.part-sub { font-size: 0.8em; color: var(--muted); line-height: 1.3; }
.part.lit .part-sub { color: var(--fg); }
.token {
  display: inline-block;
  margin-top: 0.25em;
  padding: 0 0.4em;
  border: 1.5px solid var(--accent);
  border-radius: 5px;
  background: var(--token-bg);
  color: var(--fg);
  font-size: 0.8em;
  font-weight: 600;
}
.arrow-line {
  position: absolute;
  height: 3px;
  margin-top: -1.5px;
  background: var(--accent);
  transform-origin: 0 50%;
  pointer-events: none;
  z-index: 3;
}
.arrow-line::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 50%;
  transform: translateY(-50%);
  border-left: 10px solid var(--accent);
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- caption and controls ---------- */

.anim-foot {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  border-top: 1px solid var(--border);

}
.controls { display: flex; align-items: center; gap: 0.25rem; flex: none; }
.btn {
  flex: none;
  font: inherit;
  font-size: 0.95rem;

  min-width: 2.1rem;
  height: 2.1rem;

  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  color: var(--fg);

.btn.play { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); padding: 0 0.6rem; font-weight: 650; }
.btn .lbl { margin-left: 0.3em; font-size: 0.9em; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.caption {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  font-size: calc(1.02rem * var(--cap-scale, 1));

}
:root[lang="km"] .caption { line-height: 1.62; }
:root[lang="km"] .panel-head, :root[lang="km"] .frame-head, :root[lang="km"] .counter { font-size: 0.86rem; }

.caption code { background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 0 0.2em; }
.progress { position: absolute; left: 0; right: 0; top: -2px; height: 3px; pointer-events: none; }
.progress .bar { height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }

html[data-mode="compact"] .anim { padding: 0.25rem 0.4rem 0.3rem; gap: 0.25rem; }
html[data-mode="compact"] .anim-head { gap: 0.3rem; min-height: 0; }
html[data-mode="compact"] .anim-head .btn { height: 1.75rem; min-width: 1.85rem; font-size: 0.85rem; }
html[data-mode="compact"] .anim-foot { gap: 0.3rem; padding-top: 0.2rem; }
html[data-mode="compact"] .anim-foot .btn { height: 2.2rem; min-width: 1.9rem; }
html[data-mode="compact"] .btn .lbl { display: none; }
html[data-mode="compact"] .counter { font-size: 0.8rem; }
html[data-mode="compact"] .caption { line-height: 1.3; }
:root[lang="km"][data-mode="compact"] .caption { line-height: 1.6; }
html[data-mode="compact"] .panel.shown .panel-head.has-sub { display: flex; }
html[data-mode="compact"] .panel-head .name { display: none; }
html[data-mode="stacked"] .anim-foot { flex-direction: column; align-items: stretch; }
html[data-mode="stacked"] .caption { -webkit-line-clamp: 6; }

/* ---------- motion ---------- */

@keyframes anim-flash { from { background-color: var(--flash); } }
.ln.lit, .row.lit, .ol.lit, .fr.st-new, .fr.st-changed, .part.lit { animation: anim-flash 0.7s ease-out; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

  // ---------- small helpers ----------

  function tx(value) {
    if (value && typeof value === "object" && !Array.isArray(value)) return value[LANG] || value.en || "";
    return value == null ? "" : String(value);
  }

  function el(tag, className, text) {
    var node = doc.createElement(tag);

  // ---------- values, Python style ----------

  function isDict(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }

  function special(v) {
    if (!isDict(v)) return null;
    if ("$repr" in v) return "repr";
    if ("$tuple" in v) return "tuple";
    if ("$object" in v) return "object";
    return null;
  }

  function pyStr(s) {
    return "\"" + String(s).replace(/\\/g, "\\\\").replace(/"/g, "\\\"").replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r").replace(/\t/g, "\\t") + "\"";
  }

  function reprText(v) {
    if (v === null) return "None";
    if (v === true) return "True";
    if (v === false) return "False";
    if (typeof v === "number") return String(v);
    if (typeof v === "string") return pyStr(v);
    if (Array.isArray(v)) return "[" + v.map(reprText).join(", ") + "]";
    var kind = special(v);
    if (kind === "repr") return String(v.$repr);
    if (kind === "tuple") return "(" + v.$tuple.map(reprText).join(", ") + (v.$tuple.length === 1 ? ",)" : ")");
    if (kind === "object") {
      return v.$object + "(" + Object.keys(v.fields || {}).map(function (k) {
        return k + "=" + reprText(v.fields[k]);
      }).join(", ") + ")";
    }
    return "{" + Object.keys(v).map(function (k) { return pyStr(k) + ": " + reprText(v[k]); }).join(", ") + "}";
  }

  function scalarNode(v) {
    var cls = "v-repr";
    if (typeof v === "string") cls = "v-str";
    else if (typeof v === "number") cls = "v-num";
    else if (v === null || v === true || v === false) cls = "v-const";
    else if (special(v) === "tuple" || Array.isArray(v) || isDict(v)) cls = "";
    return el("span", cls, reprText(v));
  }

  function dictNode(v, depth, quoteKeys) {
    var box = el("span", "dict");
    Object.keys(v).forEach(function (k) {
      add(box, add(el("span", "drow"),
        el("span", quoteKeys ? "v-str" : "nm", quoteKeys ? pyStr(k) : k),
        el("span", "arr", quoteKeys ? "→" : "="),
        valueNode(v[k], depth + 1)));
    });
    return box;
  }

  function valueNode(v, depth) {
    var kind = special(v);
    if (kind === "object") {
      var box = add(el("span", "obj"), el("span", "obj-head", v.$object));
      if (Object.keys(v.fields || {}).length) add(box, dictNode(v.fields, depth, false));
      return box;

    if (Array.isArray(v) && v.length && depth < 2) {

      });
      return cells;
    }
    if (isDict(v) && !kind && Object.keys(v).length && depth < 2) return dictNode(v, depth, true);
    return scalarNode(v);
  }

  // ---------- panel renderers ----------

  function renderCode(P, st) {

    if (info.label != null) {

    var lines = el("div", "code-lines");

  function renderMemory(P, st) {

  function renderOutput(P, st) {

    st.output.forEach(function (line) {

  function renderFiles(P, st) {
    if (!st.files.length) { add(P.body, el("div", "empty", T.no_files)); return; }
    var rows = [], byKey = {};
    st.files.forEach(function (f) {
      var isDir = /\/$/.test(f.path);
      var bits = f.path.replace(/\/$/, "").split("/");
      for (var i = 1; i < bits.length; i++) {
        var parent = bits.slice(0, i).join("/") + "/";
        if (!byKey[parent]) { byKey[parent] = { path: parent }; rows.push(byKey[parent]); }
      }
      var key = isDir ? bits.join("/") + "/" : f.path;
      if (byKey[key] && isDir && !byKey[key].given) {
        var at = rows.indexOf(byKey[key]);
        rows[at] = byKey[key] = { given: true, f: f, path: key };
      } else {
        byKey[key] = { given: true, f: f, path: key };
        rows.push(byKey[key]);
      }
    });
    var tree = el("div", "ftree");
    rows.forEach(function (r) {
      var f = r.f || { path: r.path };
      var isDir = /\/$/.test(r.path);
      var bits = r.path.replace(/\/$/, "").split("/");
      var depth = bits.length - 1;
      var row = el("div", "fr" + (f.state ? " st-" + f.state : ""));
      row.style.setProperty("--d", depth);
      add(row, el("span", "ficon", isDir ? "📁" : (f.state === "broken" ? "⚠️" : "📄")),
        el("span", "fname", bits[bits.length - 1] + (isDir ? "/" : "")));
      if (f.state) add(row, el("span", "badge", T["state_" + f.state]));

        add(tree, pre);

    add(P.body, tree);
  }

  function renderSystem(P, st, parts) {
    var s = st.system || {};
    var lit = s.lit || [], done = s.done || [];
    var grid = el("div", "parts");
    parts.forEach(function (part) {
      var card = el("div", "part" + (lit.indexOf(part.id) >= 0 ? " lit" : "") + (done.indexOf(part.id) >= 0 ? " done" : ""));

      if (done.indexOf(part.id) >= 0) add(card, el("span", "sr-only", T.done));
      if (s.token && s.token.on === part.id) add(card, rich(el("div", "token"), tx(s.token.text)));
      add(grid, card);

      var names = {};
      parts.forEach(function (p) { names[p.id] = p.label; });
      add(grid, el("span", "sr-only", T.arrow.replace("{a}", names[s.arrow[0]]).replace("{b}", names[s.arrow[1]])));

    add(P.body, grid);
  }

  function drawArrows(scope) {
    var grids = scope.querySelectorAll(".parts[data-arrow]");
    Array.prototype.forEach.call(grids, function (grid) {
      Array.prototype.forEach.call(grid.querySelectorAll(".arrow-line"), function (n) { n.remove(); });
      var ids = grid.getAttribute("data-arrow").split(" ");
      var a = grid.querySelector("[data-id=\"" + ids[0] + "\"]");
      var b = grid.querySelector("[data-id=\"" + ids[1] + "\"]");
      if (!a || !b || a === b || !grid.offsetWidth) return;
      var box = grid.getBoundingClientRect();
      function rect(node) {
        var r = node.getBoundingClientRect();
        return { cx: r.left - box.left + r.width / 2, cy: r.top - box.top + r.height / 2, w: r.width, h: r.height };
      }
      function edge(r, toward, gap) {
        var dx = toward.cx - r.cx, dy = toward.cy - r.cy;
        var sx = dx ? (r.w / 2 + gap) / Math.abs(dx) : Infinity;
        var sy = dy ? (r.h / 2 + gap) / Math.abs(dy) : Infinity;
        var s = Math.min(sx, sy);
        return { x: r.cx + dx * s, y: r.cy + dy * s };

      line.style.left = p.x + "px";
      line.style.top = p.y + "px";
      line.style.width = len + "px";
      line.style.transform = "rotate(" + Math.atan2(q.y - p.y, q.x - p.x) + "rad)";
      grid.appendChild(line);
    });
  }

  // ---------- the player ----------

  function readHash() {
    var out = { step: 1, theme: null, embed: false, audit: false };
    String(win.location.hash || "").replace(/^#/, "").split("&").forEach(function (pair) {
      var kv = pair.split("=");
      var key = decodeURIComponent(kv[0] || ""), value = decodeURIComponent(kv[1] || "");
      if (key === "step") out.step = parseInt(value, 10) || 1;
      else if (key === "theme" && (value === "dark" || value === "light")) out.theme = value;
      else if (key === "embed") out.embed = value !== "0";
      else if (key === "audit") out.audit = value !== "0";
    });
    return out;
  }

  // What a panel shows, without the "lit" marks, so that only real changes count.
  function signature(panel, content) {
    if (panel === "memory") {
      return JSON.stringify((content || []).map(function (f) {
        return [f.frame || f.label, !!f.fading, "returns" in f ? f.returns : "-", (f.names || []).map(function (n) {
          return Array.isArray(n) ? [n[0], n[1], "-", "-"] :
            [n.name, n.value, "old" in n ? n.old : "-", "note" in n ? n.note : "-"];
        })];
      }));
    }
    if (panel === "output") {
      return JSON.stringify((content || []).map(function (l) {
        return typeof l === "string" ? [l, ""] : [l.text, l.kind || ""];
      }));
    }
    return JSON.stringify(content);
  }

  function modeFor(width, height) {
    if (width < 560 && height >= 600) return "stacked";
    if (width < 560 || height < 300) return "compact";
    return "wide";
  }

  function start() {
    var A = JSON.parse(doc.getElementById("anim-data").textContent);
    var steps = A.steps, N = steps.length, panels = A.panels;
    var parts = (A.system && A.system.parts) || [];

    // Effective state of every step: a panel key replaces that panel; a missing key keeps the last one.
    // A panel "changed" when its content differs from the step before (moving the light alone does not count).
    var states = [], changed = [], focus = [];
    var now = { code: A.code || null, memory: [], output: [], files: [], system: {} };
    steps.forEach(function (s, i) {
      var ch = {};
      PANEL_KEYS.forEach(function (k) {
        if (k in s) {
          if (signature(k, s[k]) !== signature(k, now[k])) ch[k] = true;
          now[k] = s[k];
        }
      });
      var line = s.line == null ? [] : [].concat(s.line);
      states.push({ code: now.code, memory: now.memory, output: now.output, files: now.files, system: now.system, line: line });
      changed.push(ch);
      var f = s.focus || panels.filter(function (p) { return ch[p]; })[0] ||
        (line.length && panels.indexOf("code") >= 0 ? "code" : null) || (i ? focus[i - 1] : panels[0]);
      focus.push(f);
    });

    // Skeleton.
    var app = doc.getElementById("anim");
    var head = el("header", "anim-head");
    var title = rich(el("h1", "anim-title"), tx(A.title));
    title.title = plain(tx(A.title));
    var tabs = el("div", "tabs");
    tabs.setAttribute("role", "tablist");
    var counter = el("span", "counter");
    var pop = el("a", "pop", "⤢");
    pop.target = "_blank";
    pop.rel = "noopener";
    pop.title = T.open;
    pop.setAttribute("aria-label", T.open);
    // Wide box: the first `left` panels (default 1) share the left column, the others the right one.
    var nLeft = panels.length > 1 ? Math.max(1, Math.min(A.left || 1, panels.length - 1)) : 1;
    var columns = [panels.slice(0, nLeft), panels.slice(nLeft)];
    var baseGrow = 1;   // the left column's share of the width (flex-grow; the right column has 1)
    var area = el("div", "anim-panels");
    var left = el("div", "col left" + (panels[0] === "code" && panels.length > 1 ? " code-first" : ""));
    var right = el("div", "col right");
    add(area, left);
    if (panels.length > 1) add(area, right);
    if (panels[0] === "code" && panels.length > 1) {
      // A wider code column when the longest code line is long (the 700×420 box), unless an output line
      // is long too: then both columns get the same width, because a long code line can shrink a little
      // while an output line would wrap.
      var longest = 0, longestOut = 0;

        if (!c) return;
        (Array.isArray(c) ? c : c.lines).forEach(function (line) { longest = Math.max(longest, line.length); });
      });
      steps.forEach(function (s) {

      tab.type = "button";
      tab.setAttribute("role", "tab");

      h.addEventListener("click", function () {
        if (section.classList.contains("collapsed")) { userPanel = name; fit(); }
      });
      h.addEventListener("keydown", function (event) {

        }
      });
      add(tabs, tab);
      P[name] = { name: name, el: section, head: h, sub: sub, body: body, tab: tab, more: more };
    });

    var mode = null;
    function applyMode() {
      var m = modeFor(win.innerWidth, win.innerHeight);
      if (m === mode) return;
      mode = m;
      root.setAttribute("data-mode", m);
      if (m === "compact") {

        add(foot, progress, bPrev, caption, bNext);

    var current = 0, playing = false, timer = null, userPanel = null;
    var growCap = 1.35, lastGrow = 1;

    // Render every step in this window and sum up how it fitted, per column (0 left, 1 right):
    // px of content wider than its panel, panels that scroll, panels folded to their title bar.
    function survey() {
      var s = { cap: 1.35, over: [0, 0], scroll: [0, 0], folded: [0, 0] };
      growCap = 1.35;
      for (var i = 0; i < N; i++) {

        render(i);
        s.cap = Math.min(s.cap, lastGrow);
        panels.forEach(function (name, k) {

          if (p.body.classList.contains("scroll")) s.scroll[c]++;
          if (p.el.classList.contains("collapsed")) s.folded[c]++;
        });
      }
      return s;
    }

    // One text size for the whole animation in this window: the largest that every step can use,
    // so the text does not jump from step to step while playing. In the wide box, a column whose
    // content is too wide even at the smallest font (a long code line) takes width from the other
    // column, a little at a time, while the other column needs no more scrolling or folding than before.
    // The column widths are the same for every step.
    function measureGrow() {
      var keep = current, grow = baseGrow;
      left.style.flexGrow = grow;
      var best = survey();
      if (mode === "wide" && panels.length > 1 && (best.over[0] > 0) !== (best.over[1] > 0)) {
        var side = best.over[0] > 0 ? 0 : 1, other = 1 - side;
        for (var k = 1; k <= 8 && best.over[side] > 0; k++) {
          var g = side === 0 ? baseGrow * (1 + 0.08 * k) : baseGrow / (1 + 0.08 * k);
          left.style.flexGrow = g;
          var s = survey();
          if (s.over[other] > best.over[other] || s.scroll[other] > best.scroll[other] ||
              s.folded[other] > best.folded[other]) break;
          if (s.over[side] < best.over[side]) { best = s; grow = g; }
        }
        left.style.flexGrow = grow;
      }
      growCap = best.cap;
      current = keep;
    }

    function render(i) {
      var st = states[i];
      panels.forEach(function (name) {
        var p = P[name];
        p.body.textContent = "";
        if (name === "code") renderCode(p, st);
        else if (name === "memory") renderMemory(p, st);
        else if (name === "output") renderOutput(p, st);
        else if (name === "files") renderFiles(p, st);
        else if (name === "system") renderSystem(p, st, parts);
        p.el.classList.toggle("changed", !!changed[i][name]);
        p.tab.classList.toggle("changed", !!changed[i][name]);
      });
      caption.textContent = "";
      rich(caption, tx(steps[i].caption));
      caption.title = plain(tx(steps[i].caption));
      counter.textContent = T.step + " " + (i + 1) + " / " + N;
      bar.style.width = (N > 1 ? (100 * i / (N - 1)) : 100) + "%";
      bPrev.disabled = i === 0;
      bNext.disabled = i === N - 1;
      var base = String(win.location.href).split("#")[0];
      pop.href = base + "#step=" + (i + 1);
      fit();
    }

    function tooWide(node) { return node.scrollWidth > node.clientWidth + 1; }
    function overflows(node) { return node.scrollHeight > node.clientHeight + 1 || tooWide(node); }

    // The "→" at the right edge, beside the content (not below it): while the content goes on further
    // to the right than the student has scrolled.
    function showMore(p) {
      var b = p.body;
      var on = p.el.classList.contains("hscroll") && b.scrollLeft + b.clientWidth < b.scrollWidth - 2;
      p.el.classList.toggle("more-right", on);
      if (!on) return;
      var height = b.clientHeight, last = b.lastElementChild;
      if (last && b.scrollHeight <= b.clientHeight + 1) {
        height = Math.min(height, last.offsetTop - b.offsetTop + last.offsetHeight + 4);
      }
      p.more.style.top = b.offsetTop + "px";
      p.more.style.height = height + "px";
    }

    // A panel that scrolls inside itself can be reached with Tab and is named for screen readers;
    // the attributes go away when it no longer scrolls. Only changed attributes are touched, so a panel
    // that keeps scrolling keeps its focus when the step is drawn again.
    function setReachable(p) {
      var b = p.body, side = p.el.classList.contains("hscroll");
      var can = side || (b.classList.contains("scroll") && b.scrollHeight > b.clientHeight + 1);
      var label = can ? (side ? T.scroll_side : T.scroll_down).replace("{p}", T[p.name]) : null;
      if (can) {
        if (b.getAttribute("tabindex") !== "0") b.setAttribute("tabindex", "0");
        if (b.getAttribute("role") !== "region") b.setAttribute("role", "region");
        if (b.getAttribute("aria-label") !== label) b.setAttribute("aria-label", label);
      } else if (b.hasAttribute("tabindex")) {
        b.removeAttribute("tabindex");
        b.removeAttribute("role");
        b.removeAttribute("aria-label");
      }
    }

    function scrollToLit(body) {
      var lit = body.querySelector(".lit, .st-new, .st-changed");
      if (!lit) return;
      var b = body.getBoundingClientRect(), r = lit.getBoundingClientRect();
      body.scrollTop += (r.top - b.top) - Math.max(0, (b.height - r.height) / 2);
    }

    // Fit the step into the window: collapse panels that matter least, shrink fonts a little,
    // and as a last resort let one panel scroll inside itself. The page itself never scrolls.
    function fit() {
      var view = userPanel || focus[current];
      panels.forEach(function (name) {
        var p = P[name];
        p.el.classList.remove("collapsed", "grow", "shown", "hscroll", "more-right");
        p.body.classList.remove("scroll");
        p.body.style.removeProperty("--scale");
        p.body.scrollTop = 0;
        p.body.scrollLeft = 0;
        p.head.removeAttribute("tabindex");
        p.head.removeAttribute("role");
        var on = name === view;
        p.tab.setAttribute("aria-selected", on ? "true" : "false");
        p.tab.tabIndex = on ? 0 : -1;
      });
      caption.style.removeProperty("--cap-scale");
      var visible = panels.slice();
      if (mode === "compact") {
        P[view].el.classList.add("shown");
        visible = [view];
      } else if (mode === "wide") {
        // In a column with several panels, keep the step's focus (or the first changed panel) open and
        // fold the others to their title bar while the column is too full: unchanged ones first, bottom up.
        columns.forEach(function (rest) {
          if (rest.length < 2) return;
          var keep = rest.indexOf(view) >= 0 ? view : (rest.filter(function (n) { return changed[current][n]; })[0] || rest[0]);
          P[keep].el.classList.add("grow");
          var order = rest.filter(function (n) { return n !== keep && !changed[current][n]; }).reverse()
            .concat(rest.filter(function (n) { return n !== keep && changed[current][n]; }).reverse());
          var tooTall = function () {
            return rest.some(function (n) {
              var body = P[n].body;
              return !P[n].el.classList.contains("collapsed") && body.scrollHeight > body.clientHeight + 1;
            });
          };
          order.forEach(function (n) {
            if (tooTall()) {
              P[n].el.classList.add("collapsed");
              P[n].head.tabIndex = 0;
              P[n].head.setAttribute("role", "button");
              visible.splice(visible.indexOf(n), 1);
            }
          });
        });
      }
      var test = mode === "stacked" ? tooWide : overflows;
      // Room to spare (short code, few names)? Make all visible panels larger together, up to 135 %.
      var anyOver = function () { return visible.some(function (n) { return test(P[n].body); }); };
      if (mode !== "stacked" && !anyOver()) {
        var grow = 1;
        while (grow < growCap) {
          var next = Math.round((grow + 0.05) * 100) / 100;
          visible.forEach(function (n) { P[n].body.style.setProperty("--scale", next); });
          if (anyOver()) {
            visible.forEach(function (n) {
              if (grow === 1) P[n].body.style.removeProperty("--scale");
              else P[n].body.style.setProperty("--scale", grow);
            });
            break;
          }
          grow = next;
        }
        lastGrow = grow;
      } else {
        lastGrow = 1;
      }
      visible.forEach(function (n) {
        var body = P[n].body, scale = parseFloat(body.style.getPropertyValue("--scale")) || 1;
        while (test(body) && scale > 0.8) {
          scale = Math.round((scale - 0.05) * 100) / 100;
          body.style.setProperty("--scale", scale);
        }
        if (mode !== "stacked" && overflows(body)) { body.classList.add("scroll"); scrollToLit(body); }
        // Still too wide (a long code line): it scrolls sideways, and the "→" shows there is more.
        if (tooWide(body)) P[n].el.classList.add("hscroll");
        showMore(P[n]);
      });
      panels.forEach(function (n) { setReachable(P[n]); });
      var cap = 1;
      while (caption.scrollHeight > caption.clientHeight + 1 && cap > 0.84) {
        cap = Math.round((cap - 0.04) * 100) / 100;
        caption.style.setProperty("--cap-scale", cap);
      }
      drawArrows(area);
    }

    function delay(i) {
      var s = steps[i];
      return s.ms || Math.max(2600, 45 * plain(tx(s.caption)).length);
    }
    function setPlaying(on) {
      playing = on;
      clearTimeout(timer);
      bPlay.firstChild.textContent = on ? "⏸" : "▶";
      bPlay.lastChild.textContent = on ? T.pause : T.play;
      bPlay.setAttribute("aria-label", on ? T.pause : T.play);
      bPlay.title = on ? T.pause : T.play;
      if (on) schedule();
    }
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (!playing) return;
        if (current < N - 1) go(current + 1, true);
        if (current >= N - 1) setPlaying(false);
        else schedule();
      }, delay(current));
    }
    function go(i, fromPlay) {
      current = Math.max(0, Math.min(N - 1, i));
      userPanel = null;
      if (!fromPlay && playing) setPlaying(false);
      render(current);
    }
    function toggle() {
      if (playing) { setPlaying(false); return; }
      if (current >= N - 1) go(0);
      setPlaying(true);
    }

    bStart.addEventListener("click", function () { go(0); });
    bPrev.addEventListener("click", function () { go(current - 1); });
    bNext.addEventListener("click", function () { go(current + 1); });
    bPlay.addEventListener("click", toggle);
    doc.addEventListener("keydown", function (event) {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      var t = event.target, tag = t && t.tagName;
      var sideways = t && t.classList && t.classList.contains("panel-body") && t.scrollWidth > t.clientWidth + 1;
      if (sideways && (event.key === "ArrowRight" || event.key === "ArrowLeft")) {
        // A focused panel that scrolls sideways: the arrows scroll it; the step stays.
        event.preventDefault();
        var by = Math.max(40, Math.round(t.clientWidth / 4));
        t.scrollLeft += event.key === "ArrowRight" ? by : -by;
      }
      else if (event.key === "ArrowRight") { event.preventDefault(); go(current + 1); }
      else if (event.key === "ArrowLeft") { event.preventDefault(); go(current - 1); }
      else if (event.key === " " || event.key === "Spacebar") {
        if (tag === "BUTTON" || tag === "A" || (t && t.getAttribute && t.getAttribute("role") === "button")) return;
        event.preventDefault();
        toggle();
      }
    });

    var resizeQueued = false;
    win.addEventListener("resize", function () {
      if (resizeQueued) return;
      resizeQueued = true;
      win.requestAnimationFrame(function () { resizeQueued = false; applyMode(); measureGrow(); render(current); });
    });

    function applyHash() {
      var h = readHash();
      if (h.theme) root.setAttribute("data-theme", h.theme); else root.removeAttribute("data-theme");
      var framed = false;
      try { framed = win.self !== win.top; } catch (e) { framed = true; }
      root.setAttribute("data-embed", framed || h.embed ? "1" : "0");
      return h;
    }
    win.addEventListener("hashchange", function () { go(applyHash().step - 1); });

    var opts = applyHash();
    applyMode();
    measureGrow();
    go(opts.step - 1);

    // audit=1: render every step and record how it fits (tools/anim.py --shots reads it).
    function audit() {
      var report = { mode: mode, width: win.innerWidth, height: win.innerHeight, steps: [],
        columns: panels.length > 1 ? [Math.round(parseFloat(left.style.flexGrow) * 100) / 100, 1] : [1] };
      for (var i = 0; i < N; i++) {
        current = i;
        userPanel = null;
        render(i);
        var item = { n: i + 1 };
        var pageOver = Math.max(root.scrollHeight - win.innerHeight, root.scrollWidth - win.innerWidth,
          app.scrollHeight - app.clientHeight);
        if (pageOver > 1) item.page_overflow = pageOver;
        // scroll: panels that scroll inside themselves; tall: ... because the content is too tall;
        // wide: panel -> px by which the content is wider than the panel (it scrolls sideways).
        var scroll = [], tall = [], wide = {}, collapsed = [], hidden = [], scale = 1;
        panels.forEach(function (name) {
          var p = P[name], b = p.body;
          if (b.classList.contains("scroll")) {
            scroll.push(name);
            if (b.scrollHeight > b.clientHeight + 1) tall.push(name);
          }
          if (tooWide(b)) wide[name] = b.scrollWidth - b.clientWidth;
          if (p.el.classList.contains("collapsed")) collapsed.push(name);
          if (!b.offsetWidth) hidden.push(name);
          var s = parseFloat(b.style.getPropertyValue("--scale"));
          if (s && s < scale) scale = s;
        });
        // A folded panel (wide box) or another tab (compact box) measures 0 × 0. Open it the way the
        // student would (click its title bar or tab), measure its width, then draw the step as before.
        // wide_open: panel -> px by which it is too wide once opened.
        var wideOpen = {};
        hidden.forEach(function (name) {
          userPanel = name;
          fit();
          var b = P[name].body;
          if (b.offsetWidth && tooWide(b)) wideOpen[name] = b.scrollWidth - b.clientWidth;
        });
        if (hidden.length) { userPanel = null; fit(); }
        if (scroll.length) item.scroll = scroll;
        if (tall.length) item.tall = tall;
        if (Object.keys(wide).length) item.wide = wide;
        if (Object.keys(wideOpen).length) item.wide_open = wideOpen;
        if (collapsed.length) item.collapsed = collapsed;
        if (scale < 1) item.scale = scale;
        if (caption.scrollHeight > caption.clientHeight + 1) item.caption_clipped = true;
        report.steps.push(item);
      }
      doc.body.setAttribute("data-audit", JSON.stringify(report));
    }

    // Once the fonts are ready (a late font can be wider), measure again, then audit and say "ready".
    function settle() {
      var shown = current;
      measureGrow();
      if (opts.audit) audit();
      current = shown;
      userPanel = null;
      render(current);
      doc.body.setAttribute("data-ready", "1");
      notifyParent();
    }
    if (doc.fonts && doc.fonts.ready && typeof doc.fonts.ready.then === "function") {
      doc.fonts.ready.then(function () {
        try { settle(); } catch (error) { reportError((error && error.message) || error); }
      });
    } else {
      settle();
    }
  }

  try {
    start();
  } catch (error) {
    reportError((error && error.message) || error);
    throw error;
  }
})();
</script>
</body>
</html>
