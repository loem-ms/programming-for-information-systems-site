<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A dictionary of counts becomes a bar chart: keys are the bar names, values the heights</title><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w06-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w06-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w06-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w06-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">From a dictionary of counts to a bar chart</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Each key becomes the name under a bar. Each value becomes the height of the bar.</text><rect x="30" y="104" width="400" height="101" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="135" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">counts = {&quot;delivered&quot;: 339,</text><text x="44" y="162" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">          &quot;cancelled&quot;: 43,</text><text x="44" y="189" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">          &quot;rejected&quot;: 22}</text><text x="30" y="230" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">keys → the names under the bars</text><text x="30" y="258" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">values → the heights of the bars</text><rect x="30" y="300" width="440" height="92" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="328" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">plt.bar(list(counts.keys()),</text><text x="44" y="352" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">        list(counts.values()))</text><text x="44" y="376" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">plt.show()</text><polyline points="446,160 516,160" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><line x1="540" y1="380" x2="970" y2="380" stroke="#1f2d3a" stroke-width="2"/><line x1="540" y1="380" x2="540" y2="100" stroke="#1f2d3a" stroke-width="2"/><rect x="575" y="120" width="96" height="260" fill="#426583" rx="3"/><text x="623" y="112" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">339</text><text x="623" y="404" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">delivered</text><rect x="710" y="347" width="96" height="33" fill="#426583" rx="3"/><text x="758" y="339" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">43</text><text x="758" y="404" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">cancelled</text><rect x="845" y="363" width="96" height="17" fill="#426583" rx="3"/><text x="893" y="355" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">22</text><text x="893" y="404" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">rejected</text></svg>
