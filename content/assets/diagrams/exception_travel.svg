<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>An exception from int travels up through the calls: caught by except it becomes a message, not caught it stops the program with a traceback</title><rect width="1000" height="540" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w05-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w05-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w05-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w05-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">An exception travels up until something catches it</text><text x="30" y="78" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">int(&quot;many&quot;)</text><text x="150" y="78" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">raises a ValueError: Python cannot turn this text into a whole number.</text><rect x="30" y="104" width="390" height="60" rx="12" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="72" y="130" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">print(total_portions([&quot;30&quot;, &quot;many&quot;]))</text><text x="72" y="153" font-size="15" font-weight="400" fill="#213449" text-anchor="start">your cell</text><text x="44" y="131" font-size="18" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">③</text><rect x="30" y="204" width="390" height="60" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="72" y="230" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">total_portions(texts)</text><text x="72" y="253" font-size="15" font-weight="400" fill="#213449" text-anchor="start">calls read_portions for each text</text><text x="44" y="231" font-size="18" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">②</text><rect x="30" y="304" width="390" height="60" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="72" y="330" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">read_portions(text)</text><text x="72" y="353" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">return int(text)</text><text x="44" y="331" font-size="18" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">①</text><rect x="30" y="404" width="390" height="60" rx="12" fill="#fbe4e2" stroke="#b3261e" stroke-width="2.5"/><text x="225" y="441" font-size="18" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">int(&quot;many&quot;)</text><line x1="70" y1="166" x2="70" y2="200" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><text x="80" y="189" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">calls</text><line x1="330" y1="202" x2="330" y2="168" stroke="#b3261e" stroke-width="3" marker-end="url(#w05-b3261e)"/><text x="304" y="189" font-size="15" font-weight="700" fill="#b3261e" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">ValueError</text><line x1="70" y1="266" x2="70" y2="300" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><text x="80" y="289" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">calls</text><line x1="330" y1="302" x2="330" y2="268" stroke="#b3261e" stroke-width="3" marker-end="url(#w05-b3261e)"/><text x="304" y="289" font-size="15" font-weight="700" fill="#b3261e" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">ValueError</text><line x1="70" y1="366" x2="70" y2="400" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><text x="80" y="389" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">calls</text><line x1="330" y1="402" x2="330" y2="368" stroke="#b3261e" stroke-width="3" marker-end="url(#w05-b3261e)"/><text x="304" y="389" font-size="15" font-weight="700" fill="#b3261e" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">ValueError</text><line x1="420" y1="124" x2="474" y2="124" stroke="#b3261e" stroke-width="3" marker-end="url(#w05-b3261e)"/><rect x="480" y="100" width="490" height="150" rx="12" fill="#fbe4e2" stroke="#b3261e" stroke-width="2.5"/><text x="500" y="132" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start">nobody catches it</text><text x="500" y="166" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">a traceback appears</text><text x="500" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">the program stops</text><text x="500" y="222" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">read it from the last line up</text><polyline points="420,148 446,148 446,380 474,380" fill="none" stroke="#1c7a3a" stroke-width="3" marker-end="url(#w05-1c7a3a)"/><line x1="420" y1="234" x2="446" y2="234" stroke="#1c7a3a" stroke-width="3" stroke-dasharray="5 4"/><line x1="420" y1="334" x2="446" y2="334" stroke="#1c7a3a" stroke-width="3" stroke-dasharray="5 4"/><rect x="480" y="276" width="490" height="244" rx="12" fill="#e3f4e8" stroke="#1c7a3a" stroke-width="2.5"/><text x="500" y="306" font-size="17" font-weight="700" fill="#1c7a3a" text-anchor="start">Caught by try / except</text><rect x="496" y="320" width="458" height="108" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="510" y="346" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">try:</text><text x="510" y="368" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    print(total_portions(texts))</text><rect x="500" y="374" width="450" height="22" rx="4" fill="#ffe9b8"/><text x="510" y="390" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">except ValueError:</text><text x="510" y="412" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    print(&quot;Please check the portions.&quot;)</text><text x="500" y="454" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">except runs, and the program goes on</text><text x="500" y="482" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Here the try is in your cell.</text><text x="500" y="506" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Any function on the way up can catch it the same way.</text></svg>
