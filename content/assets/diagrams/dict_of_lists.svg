<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>MENU is a dictionary of lists: each day is a key, and its list holds that day&#x27;s dishes</title><rect width="1000" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w06-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w06-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w06-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w06-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">A dictionary finds a value by its key</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Like a row of drawers, each with a label: the label is the key, inside is the value.</text><rect x="30" y="96" width="560" height="230" rx="14" fill="#fbfcfd" stroke="#213449" stroke-width="2.5"/><text x="50" y="126" font-size="18" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">MENU</text><text x="110" y="126" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">each key → its list of dishes</text><rect x="50" y="144" width="130" height="44" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="115" y="172" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;monday&quot;</text><polyline points="184,166 212,166" fill="none" stroke="#5f6c78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-5f6c78)"/><rect x="216" y="144" width="356" height="44" rx="8" fill="#ffffff" stroke="#b7c2cc" stroke-width="2.5"/><rect x="224" y="151" width="122" height="30" rx="6" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="285.0" y="171" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fried rice&quot;</text><rect x="352" y="151" width="131" height="30" rx="6" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="417.5" y="171" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;noodle soup&quot;</text><rect x="50" y="202" width="130" height="44" rx="8" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="115" y="230" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;tuesday&quot;</text><polyline points="184,224 212,224" fill="none" stroke="#5f6c78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-5f6c78)"/><rect x="216" y="202" width="356" height="44" rx="8" fill="#ffffff" stroke="#b7c2cc" stroke-width="2.5"/><rect x="224" y="209" width="113" height="30" rx="6" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="280.5" y="229" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fish amok&quot;</text><rect x="343" y="209" width="122" height="30" rx="6" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="404.0" y="229" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fried rice&quot;</text><rect x="471" y="209" width="77" height="30" rx="6" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="509.5" y="229" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fruit&quot;</text><rect x="50" y="260" width="130" height="44" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="115" y="288" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;sunday&quot;</text><polyline points="184,282 212,282" fill="none" stroke="#5f6c78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-5f6c78)"/><rect x="216" y="260" width="356" height="44" rx="8" fill="#ffffff" stroke="#b7c2cc" stroke-width="2.5"/><text x="232" y="288" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">[]</text><text x="262" y="288" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">an empty list: no dishes</text><text x="30" y="360" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">Each key is unique: the same key again replaces the old value.</text><rect x="30" y="372" width="560" height="64" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="398" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">MENU[&quot;sunday&quot;] = [&quot;fruit&quot;]</text><rect x="34" y="404" width="552" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="420" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">MENU[&quot;sunday&quot;] = []</text><text x="620" y="110" font-size="17" font-weight="700" fill="#213449" text-anchor="start">Which value has this key?</text><rect x="620" y="122" width="350" height="42" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="634" y="148" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">MENU[&quot;tuesday&quot;]</text><text x="620" y="190" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ [&quot;fish amok&quot;, &quot;fried rice&quot;, &quot;fruit&quot;]</text><text x="620" y="228" font-size="17" font-weight="700" fill="#213449" text-anchor="start">Is it an item in that list?</text><rect x="620" y="240" width="350" height="42" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="634" y="266" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fruit&quot; in MENU[&quot;tuesday&quot;]</text><text x="620" y="308" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ True</text><text x="620" y="346" font-size="17" font-weight="700" fill="#213449" text-anchor="start">Is it one of the keys?</text><rect x="620" y="358" width="350" height="42" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="634" y="384" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fruit&quot; in MENU</text><text x="620" y="426" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ False</text><text x="620" y="452" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">in on a dictionary looks at the keys only</text></svg>
