<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>__name__ is &quot;__main__&quot; in the file a person starts and the module&#x27;s name when another file imports it, so the guarded main() runs only in the entry point</title><rect width="1000" height="480" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">One file, two ways to use it</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Python sets __name__ before the file runs. The guard runs main() only in the file a person starts.</text><text x="500" y="104" font-size="17" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">app.py</text><rect x="320" y="114" width="360" height="230" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="334" y="139" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">from rules import urgency</text><text x="334" y="160" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">...</text><text x="334" y="181" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="334" y="202" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def handle_choice(choice, records):</text><text x="334" y="223" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ...</text><text x="334" y="244" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="334" y="265" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def main():</text><text x="334" y="286" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ...</text><rect x="324" y="292" width="352" height="21" rx="4" fill="#ffe9b8"/><text x="334" y="307" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if __name__ == &quot;__main__&quot;:</text><rect x="324" y="313" width="352" height="21" rx="4" fill="#ffe9b8"/><text x="334" y="328" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    main()</text><text x="30" y="104" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">A person starts it</text><text x="30" y="126" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">in a terminal</text><rect x="30" y="136" width="250" height="40" rx="8" fill="#213449" stroke="#213449" stroke-width="2"/><text x="44" y="162" font-size="16" font-weight="700" fill="#ffe9b8" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">$ python app.py</text><line x1="155" y1="178" x2="155" y2="206" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="226" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">Python sets</text><rect x="30" y="234" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="2"/><text x="155" y="260" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">__name__ = &quot;__main__&quot;</text><line x1="155" y1="276" x2="155" y2="304" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="308" width="250" height="70" rx="12" fill="#e3f1e6" stroke="#1c7a3a" stroke-width="2"/><text x="155" y="336" font-size="17" font-weight="700" fill="#1c7a3a" text-anchor="middle">The guard is True</text><text x="155" y="362" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle">main() starts the menu</text><text x="720" y="104" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">Another file imports it</text><text x="720" y="126" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">the kit&#x27;s check does this</text><rect x="720" y="136" width="250" height="40" rx="8" fill="#f5f7fa" stroke="#213449" stroke-width="2"/><text x="734" y="162" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">import app</text><line x1="845" y1="178" x2="845" y2="206" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="720" y="226" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">Python sets</text><rect x="720" y="234" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="2"/><text x="845" y="260" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">__name__ = &quot;app&quot;</text><line x1="845" y1="276" x2="845" y2="304" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="720" y="308" width="250" height="70" rx="12" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="845" y="336" font-size="17" font-weight="700" fill="#b3261e" text-anchor="middle">The guard is False</text><text x="845" y="362" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle">main() is skipped: no menu</text><line x1="282" y1="156" x2="316" y2="156" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="718" y1="156" x2="684" y2="156" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="318" y1="312" x2="284" y2="336" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="682" y1="312" x2="716" y2="336" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="398" width="940" height="68" rx="8" fill="#fff4d6" stroke="#c27c0e" stroke-width="2"/><text x="48" y="426" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start">Without the guard, an import would start main(): the menu waits for typing, and the check never ends.</text><text x="48" y="452" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">A part (rules.py, report.py, …) holds imports, settings and functions. A demo or input() goes under the guard.</text></svg>
