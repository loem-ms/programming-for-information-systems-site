<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The Final timeline: a journal in Weeks 5 to 9, the extension chosen in Week 8, the charter in Week 9, about 3 hours at home, then Week 10: tests and labs, the submission at minute 45, Demo day</title><rect width="1160" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">From Week 5 to Demo day</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Every step gives you material for the next one: the report never starts from a blank page.</text><rect x="30" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="52" cy="116" r="13" fill="#213449"/><text x="52" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="74" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Weeks 5–9 · Session 3</text><text x="46" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">📓 Project journal,</text><text x="46" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">three lines each week:</text><text x="46" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">now · a decision · an idea</text><line x1="285" y1="158" x2="306" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="310" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="332" cy="116" r="13" fill="#213449"/><text x="332" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="354" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Week 8 · Session 3</text><text x="326" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Choose your extension</text><text x="326" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">from the menu of five</text><line x1="565" y1="158" x2="586" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="590" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="612" cy="116" r="13" fill="#213449"/><text x="612" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="634" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Week 9 · Session 3</text><text x="606" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Project charter:</text><text x="606" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">half a page, your plan</text><text x="606" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">and your first draft</text><line x1="845" y1="158" x2="866" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="870" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="8 5"/><circle cx="892" cy="116" r="13" fill="#213449"/><text x="892" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="914" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Week 9 → 10 · home</text><text x="886" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">About 3 hours: build</text><text x="886" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">the extension and its</text><text x="886" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">tests; draft the report</text><rect x="30" y="276" width="350" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="52" cy="300" r="13" fill="#213449"/><text x="52" y="305" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="74" y="306" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Week 10 · Session 1</text><text x="46" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">tests.py and the labs: a sanity check,</text><text x="46" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">the canary, how a clean run works:</text><text x="46" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">rows for your verification log</text><line x1="380" y1="342" x2="401" y2="342" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="405" y="276" width="350" height="132" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/><circle cx="427" cy="300" r="13" fill="#213449"/><text x="427" y="305" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">6</text><text x="449" y="306" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Week 10 · Session 2</text><text x="421" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Finish the report, a last clean run,</text><text x="421" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">zip and submit by minute 45,</text><text x="421" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">then rehearse your demo</text><line x1="755" y1="342" x2="776" y2="342" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="780" y="276" width="350" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="802" cy="300" r="13" fill="#213449"/><text x="802" y="305" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">7</text><text x="824" y="306" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Week 10 · Session 3</text><text x="796" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Demo day: 3 minutes, a live change,</text><text x="796" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">one question; then a short</text><text x="796" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">spoken look back</text><path d="M970,224 V250 H205 V272" fill="none" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="446" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start">Minute 45 of Week 10, Session 2 is the code freeze: your one submission. After it, you present the folder you submitted.</text></svg>
