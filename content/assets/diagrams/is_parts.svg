<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>An information system combines people, data, rules, a process and outputs</title><rect width="900" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="40" y="50" font-size="24" font-weight="700" fill="#213449" text-anchor="start">An information system = people + data + rules + process + output</text><text x="40" y="80" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Campus FoodBridge as an example</text><rect x="60" y="120" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="180.0" y="181.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="180" y="160" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">People</text><text x="180" y="190" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">donors, coordinators,</text><text x="180" y="210" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">volunteers, partners</text><rect x="330" y="120" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="450.0" y="181.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="450" y="160" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">Data</text><text x="450" y="190" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">offers: food, portions,</text><text x="450" y="210" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">hours left, status</text><rect x="600" y="120" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="720.0" y="181.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="720" y="160" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">Rules</text><text x="720" y="190" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">approve first; 20+ portions</text><text x="720" y="210" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">needs a team</text><rect x="330" y="290" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="450.0" y="351.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="450" y="330" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">Process</text><text x="450" y="360" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">offer → approve →</text><text x="450" y="380" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">pick up → deliver</text><rect x="600" y="290" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="720.0" y="351.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="720" y="330" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">Output</text><text x="720" y="360" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">a coordinator list,</text><text x="720" y="380" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">a public board</text><rect x="60" y="290" width="240" height="110" rx="12" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.5" stroke-dasharray="6 5"/><text x="180.0" y="351.0" text-anchor="middle" font-size="19" font-weight="700" fill="#5f6c78"></text><text x="180" y="330" font-size="22" font-weight="700" fill="#5f6c78" text-anchor="middle">Technology</text><text x="180" y="362" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">Python, files, a web page:</text><text x="180" y="382" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">the tools, not the system</text></svg>
