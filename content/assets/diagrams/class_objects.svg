<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The class Offer is a blueprint; the objects bread and curry keep their own data, and move_to changes only one object&#x27;s status</title><rect width="1000" height="500" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w06-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w06-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w06-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w06-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">A class is a blueprint; each object keeps its own data</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">A class bundles data and the methods that work on that data.</text><rect x="30" y="96" width="240" height="340" rx="14" fill="#f4f8fc" stroke="#426583" stroke-width="2.5" stroke-dasharray="8 6"/><text x="48" y="130" font-size="20" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">class Offer:</text><text x="48" y="156" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">the blueprint</text><text x="48" y="194" font-size="15" font-weight="700" fill="#213449" text-anchor="start">data (fields)</text><text x="62" y="222" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">self.id</text><text x="62" y="248" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">self.donor</text><text x="62" y="274" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">self.status</text><text x="48" y="320" font-size="15" font-weight="700" fill="#213449" text-anchor="start">methods</text><text x="62" y="348" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">move_to(new_status,</text><text x="62" y="370" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">        is_allowed)</text><polyline points="270,186 380,166" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><polyline points="270,330 380,346" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><text x="327" y="262" font-size="15" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Offer(...)</text><rect x="384" y="96" width="260" height="140" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="402" y="126" font-size="19" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">bread</text><text x="474" y="126" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">an object</text><text x="404" y="160" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">id = &quot;F001&quot;</text><text x="404" y="188" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">donor = &quot;Sunrise Bakery&quot;</text><rect x="394" y="196" width="240" height="27" rx="5" fill="#ffe9b8" stroke="#c27c0e" stroke-width="1.5"/><text x="404" y="216" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">status = &quot;approved&quot;</text><rect x="384" y="276" width="260" height="140" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="402" y="306" font-size="19" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">curry</text><text x="474" y="306" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">an object</text><text x="404" y="340" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">id = &quot;F004&quot;</text><text x="404" y="368" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">donor = &quot;Lotus Cafe&quot;</text><text x="404" y="396" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">status = &quot;new&quot;</text><text x="670" y="120" font-size="17" font-weight="700" fill="#213449" text-anchor="start">One call, one object</text><rect x="670" y="134" width="300" height="64" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="684" y="160" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">bread.move_to(&quot;approved&quot;,</text><text x="684" y="182" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">              can_move)</text><text x="670" y="226" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ True</text><text x="670" y="254" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">self is the bread: only it changes</text><text x="670" y="280" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">the curry is still new</text><rect x="670" y="310" width="300" height="64" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="684" y="336" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">bread.move_to(&quot;new&quot;,</text><text x="684" y="358" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">              can_move)</text><text x="670" y="402" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ False</text><text x="752" y="402" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">refused: nothing changes</text><text x="30" y="470" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">Why bundle them? The status changes only through move_to, which asks the rule first.</text></svg>
