<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>sorted with a key function: one value per record, a new list in that order, the input unchanged</title><rect width="1000" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="24" font-weight="700" fill="#213449" text-anchor="start">sorted() with a key function</text><text x="30" y="74" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">The key function gives one value per record. sorted() orders the records by that value.</text><text x="30" y="120" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">the input list</text><text x="358" y="120" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">hours_left_of(record)</text><text x="640" y="120" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">a new list, fewest hours first</text><rect x="30" y="138" width="250" height="48" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="46" y="168" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F001  Bread rolls</text><line x1="284" y1="162" x2="330" y2="162" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="358" cy="162" r="23" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="358" y="168" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><rect x="30" y="200" width="250" height="48" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="46" y="230" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F002  Fried rice boxes</text><line x1="284" y1="224" x2="330" y2="224" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="358" cy="224" r="23" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="358" y="230" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><rect x="30" y="262" width="250" height="48" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="46" y="292" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F003  Bananas</text><line x1="284" y1="286" x2="330" y2="286" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="358" cy="286" r="23" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="358" y="292" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">20</text><rect x="30" y="324" width="250" height="48" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="46" y="354" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F004  Vegetable curry</text><line x1="284" y1="348" x2="330" y2="348" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="358" cy="348" r="23" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="358" y="354" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><rect x="640" y="138" width="330" height="48" rx="10" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><circle cx="668" cy="162" r="17" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="668" y="168" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="696" y="168" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F002  Fried rice boxes</text><rect x="640" y="200" width="330" height="48" rx="10" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><circle cx="668" cy="224" r="17" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="668" y="230" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="696" y="230" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F004  Vegetable curry</text><rect x="640" y="262" width="330" height="48" rx="10" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><circle cx="668" cy="286" r="17" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="668" y="292" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="696" y="292" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F001  Bread rolls</text><rect x="640" y="324" width="330" height="48" rx="10" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><circle cx="668" cy="348" r="17" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="668" y="354" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">20</text><text x="696" y="354" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F003  Bananas</text><line x1="400" y1="262" x2="630" y2="262" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="515" y="250" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">order by the value</text><text x="30" y="412" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start">✓ The input list is unchanged: F001, F002, F003, F004.</text><text x="30" y="446" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">most_urgent = sorted(records, key=hours_left_of)</text></svg>
