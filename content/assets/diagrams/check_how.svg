<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How bridge.check reads your file: open and run it, read your constants, make cases from them, call your function once per case, compare with the expected answer</title><rect width="1000" height="480" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">How bridge.check reads your file</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">A test runner with prepared cases, like your run_tests. Your constants make the cases.</text><path d="M30,100 H282 L300,118 V314 H30 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M282,100 V118 H300" fill="none" stroke="#426583" stroke-width="2"/><text x="42" y="127" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">rules.py</text><line x1="40" y1="138" x2="290" y2="138" stroke="#dde4eb" stroke-width="1.5"/><text x="42" y="162" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">URGENT_HOURS = 3</text><text x="42" y="186" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">SOON_HOURS = 12</text><text x="42" y="210" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="42" y="234" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def urgency(hours_left):</text><text x="42" y="258" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ...</text><text x="30" y="340" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">bridge.check(&quot;urgency&quot;,</text><text x="30" y="362" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    folder=&quot;my_foodbridge&quot;)</text><rect x="350" y="96" width="620" height="56" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><circle cx="378" cy="124" r="15" fill="#213449"/><text x="378" y="130" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="404" y="120" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Open the saved file and run it</text><text x="404" y="142" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">top to bottom, like one long cell</text><rect x="350" y="162" width="620" height="56" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><circle cx="378" cy="190" r="15" fill="#213449"/><text x="378" y="196" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="404" y="186" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Read your constants</text><text x="404" y="208" font-size="15" font-weight="400" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">URGENT_HOURS = 3 · SOON_HOURS = 12</text><rect x="350" y="228" width="620" height="56" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><circle cx="378" cy="256" r="15" fill="#213449"/><text x="378" y="262" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="404" y="252" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Make cases from them</text><text x="404" y="274" font-size="15" font-weight="400" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">0, 3 → &quot;urgent&quot; · 4, 12 → &quot;soon&quot; · 13 → &quot;later&quot;</text><rect x="350" y="294" width="620" height="56" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><circle cx="378" cy="322" r="15" fill="#213449"/><text x="378" y="328" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="404" y="318" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Call your function once per case</text><text x="404" y="340" font-size="15" font-weight="400" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">urgency(4) → &quot;soon&quot;</text><rect x="350" y="360" width="620" height="56" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><circle cx="378" cy="388" r="15" fill="#213449"/><text x="378" y="394" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="404" y="384" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Compare with the expected answer</text><text x="404" y="406" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">same → ✅ · different → ❌ with a 💡 hint</text><line x1="300" y1="124" x2="346" y2="124" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="300" y1="176" x2="346" y2="190" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="300" y1="256" x2="346" y2="322" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="446" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start">Your decision never makes the check fail; only a broken rule does.</text><text x="30" y="470" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">A file with a mistake is reported with its name and line; the notebook keeps running.</text></svg>
