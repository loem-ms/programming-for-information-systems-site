<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>public_row as a filter: only the fields in PUBLIC_FIELDS pass from the full record to the public board</title><rect width="1000" height="450" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="24" font-weight="700" fill="#213449" text-anchor="start">The public row is a filter</text><text x="30" y="74" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Start with an empty dictionary. Copy only the fields on the allowed list.</text><text x="30" y="108" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">the full record (coordinator view)</text><text x="640" y="108" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">the public row (public board)</text><rect x="30" y="126" width="350" height="236" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><rect x="444" y="122" width="12" height="244" rx="4" fill="#213449"/><text x="450" y="112" font-size="15" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PUBLIC_FIELDS</text><rect x="640" y="174.0" width="330" height="140" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="42" y="153.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;id&quot;: &quot;F001&quot;,</text><path d="M386,148.0 H508 L634,196.0" fill="none" stroke="#1c7a3a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="654" y="201.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;id&quot;: &quot;F001&quot;</text><text x="42" y="177.0" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;donor&quot;: &quot;Sunrise Bakery&quot;,</text><line x1="386" y1="172.0" x2="434" y2="172.0" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/><text x="472" y="178.0" font-size="17" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">✗</text><text x="42" y="201.0" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;contact&quot;: &quot;sunrise@example.org&quot;,</text><line x1="386" y1="196.0" x2="434" y2="196.0" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/><text x="472" y="202.0" font-size="17" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">✗</text><text x="42" y="225.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;food&quot;: &quot;Bread rolls&quot;,</text><path d="M386,220.0 H508 L634,220.0" fill="none" stroke="#1c7a3a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="654" y="225.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;food&quot;: &quot;Bread rolls&quot;</text><text x="42" y="249.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;category&quot;: &quot;bread&quot;,</text><path d="M386,244.0 H508 L634,244.0" fill="none" stroke="#1c7a3a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="654" y="249.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;category&quot;: &quot;bread&quot;</text><text x="42" y="273.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;portions&quot;: 30,</text><path d="M386,268.0 H508 L634,268.0" fill="none" stroke="#1c7a3a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="654" y="273.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;portions&quot;: 30</text><text x="42" y="297.0" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;hours_left&quot;: 5,</text><line x1="386" y1="292.0" x2="434" y2="292.0" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/><text x="472" y="298.0" font-size="17" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">✗</text><text x="42" y="321.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;status&quot;: &quot;picked_up&quot;,</text><path d="M386,316.0 H508 L634,292.0" fill="none" stroke="#1c7a3a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="654" y="297.0" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;status&quot;: &quot;picked_up&quot;</text><text x="42" y="345.0" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;partner&quot;: &quot;Hope Children&#x27;s Centre&quot;</text><line x1="386" y1="340.0" x2="434" y2="340.0" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/><text x="472" y="346.0" font-size="17" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">✗</text><text x="30" y="400" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">PUBLIC_FIELDS = [&quot;id&quot;, &quot;food&quot;, &quot;category&quot;, &quot;portions&quot;, &quot;status&quot;]</text><text x="30" y="432" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">A field added later (a phone number, a note) stays hidden until a person decides to show it.</text></svg>
