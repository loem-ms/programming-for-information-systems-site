<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Counting into a dictionary: for each vote, counts.get(vote, 0) + 1</title><rect width="1000" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w06-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w06-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w06-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w06-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">Counting into a dictionary</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Five students vote for lunch. For each vote, add 1 to the count of that answer.</text><rect x="30" y="96" width="510" height="108" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="122" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">votes = [&quot;fruit&quot;, &quot;rice&quot;, &quot;fruit&quot;, &quot;bread&quot;, &quot;fruit&quot;]</text><text x="44" y="144" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">counts = {}</text><text x="44" y="166" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">for vote in votes:</text><rect x="34" y="172" width="502" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="188" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    counts[vote] = counts.get(vote, 0) + 1</text><text x="570" y="124" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">counts.get(vote, 0)</text><text x="570" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">gives 0 the first time an answer appears</text><text x="570" y="186" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">counts[vote] += 1</text><text x="570" y="212" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">fails the first time: KeyError</text><text x="30" y="250" font-size="17" font-weight="700" fill="#213449" text-anchor="start">Trace it by hand: one line per round</text><text x="30" y="282" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start">round</text><text x="100" y="282" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">vote</text><text x="220" y="282" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">counts.get(vote, 0)</text><text x="430" y="282" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start">counts afterwards</text><line x1="30" y1="294" x2="970" y2="294" stroke="#d9e1e8" stroke-width="1.5"/><rect x="275" y="299" width="60" height="25" rx="5" fill="#ffe9b8"/><text x="50" y="317" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="100" y="317" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fruit&quot;</text><text x="305" y="317" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="430" y="317" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;fruit&quot;: 1}</text><line x1="30" y1="328" x2="970" y2="328" stroke="#d9e1e8" stroke-width="1.5"/><rect x="275" y="333" width="60" height="25" rx="5" fill="#ffe9b8"/><text x="50" y="351" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="100" y="351" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;rice&quot;</text><text x="305" y="351" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="430" y="351" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;fruit&quot;: 1, &quot;rice&quot;: 1}</text><line x1="30" y1="362" x2="970" y2="362" stroke="#d9e1e8" stroke-width="1.5"/><text x="50" y="385" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="100" y="385" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fruit&quot;</text><text x="305" y="385" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="430" y="385" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;fruit&quot;: 2, &quot;rice&quot;: 1}</text><line x1="30" y1="396" x2="970" y2="396" stroke="#d9e1e8" stroke-width="1.5"/><rect x="275" y="401" width="60" height="25" rx="5" fill="#ffe9b8"/><text x="50" y="419" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="100" y="419" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;bread&quot;</text><text x="305" y="419" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="430" y="419" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;fruit&quot;: 2, &quot;rice&quot;: 1, &quot;bread&quot;: 1}</text><line x1="30" y1="430" x2="970" y2="430" stroke="#d9e1e8" stroke-width="1.5"/><text x="50" y="453" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="100" y="453" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;fruit&quot;</text><text x="305" y="453" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="430" y="453" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;fruit&quot;: 3, &quot;rice&quot;: 1, &quot;bread&quot;: 1}</text><line x1="30" y1="464" x2="970" y2="464" stroke="#d9e1e8" stroke-width="1.5"/></svg>
