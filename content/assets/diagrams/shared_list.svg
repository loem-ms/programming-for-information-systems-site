<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A number parameter gets a new value only inside the function; a list parameter changes the one list, so today_offers changes too</title><rect width="1000" height="410" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">A parameter is a second name for the same value, not a copy</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Numbers and text cannot be changed in place; a list or a dictionary can, so both names see the change.</text><rect x="30" y="90" width="380" height="304" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="50" y="120" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">A number or a text</text><rect x="50" y="134" width="170" height="44" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="64" y="162" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">price_riel = 0</text><text x="50" y="212" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">your code</text><rect x="50" y="220" width="130" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="115.0" y="243.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">price</text><line x1="180" y1="238" x2="246" y2="238" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="250" y="220" width="100" height="36" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="2"/><text x="300.0" y="243.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10000</text><text x="50" y="282" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">inside the function</text><rect x="50" y="290" width="130" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="115.0" y="313.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">price_riel</text><line x1="182" y1="296" x2="252" y2="260" stroke="#c9d3dc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="180" y1="308" x2="246" y2="308" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="250" y="290" width="100" height="36" rx="8" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="300.0" y="313.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="50" y="358" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">price_riel now points to 0.</text><text x="50" y="380" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">price still points to 10000.</text><rect x="430" y="90" width="540" height="304" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="450" y="120" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">A list or a dictionary</text><rect x="450" y="134" width="280" height="44" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="464" y="162" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">records.remove(records[1])</text><text x="450" y="212" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">your code</text><rect x="450" y="220" width="150" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="525.0" y="243.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">today_offers</text><text x="450" y="282" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">inside the function</text><rect x="450" y="290" width="150" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="525.0" y="313.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">records</text><line x1="600" y1="238" x2="656" y2="264" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="600" y1="308" x2="656" y2="282" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="808" y="318" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">one list in memory, two names</text><text x="450" y="358" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">records.remove(...) changes the one list,</text><text x="450" y="380" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">so today_offers loses F002 too.</text><rect x="660" y="252" width="68" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="694.0" y="277.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F001</text><rect x="736" y="252" width="68" height="40" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="770.0" y="277.76" font-size="16" font-weight="700" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F002</text><line x1="742" y1="286" x2="798" y2="258" stroke="#b3261e" stroke-width="2.5"/><rect x="812" y="252" width="68" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="846.0" y="277.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F003</text><rect x="888" y="252" width="68" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="922.0" y="277.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F004</text></svg>
