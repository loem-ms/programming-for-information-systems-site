<svg xmlns="http://www.w3.org/2000/svg" width="950" height="310" viewBox="0 0 950 310" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Safe save: write a temporary file, then replace the old file in one step</title><rect width="950" height="310" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="40" y="50" font-size="24" font-weight="700" fill="#213449" text-anchor="start">Saving safely: never leave a half-written file</text><rect x="40" y="110" width="230" height="80" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="155.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a">offers.json</text><text x="155.0" y="166.0" text-anchor="middle" font-size="14" fill="#1f2d3a">old, complete</text><rect x="340" y="110" width="250" height="80" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="465.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a">offers.json.tmp</text><text x="465.0" y="166.0" text-anchor="middle" font-size="14" fill="#1f2d3a">1. write new data here</text><rect x="660" y="110" width="250" height="80" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="785.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a">offers.json</text><text x="785.0" y="166.0" text-anchor="middle" font-size="14" fill="#1f2d3a">2. swap in one step</text><line x1="590" y1="150" x2="656" y2="150" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="623.0" y="142.0" text-anchor="middle" font-size="13" fill="#5f6c78">os.replace</text><text x="40" y="250" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">If the program stops during step 1, the old offers.json is still complete.</text><text x="40" y="278" font-size="16" font-weight="400" fill="#b3261e" text-anchor="start">Risky: open(&#x27;offers.json&#x27;, &#x27;w&#x27;) empties the file first, then writes.</text></svg>
