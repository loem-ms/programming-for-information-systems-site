)"/><line x1="520" y1="314" x2="640" y2="268" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440" y="296" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">loads</text><circle cx="612" cy="338" r="13" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><path d="M590,384 a22,22 0 0 1 44,0 Z" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><line x1="588" y1="364" x2="564" y2="364" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="652" y="340" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">Entry point: the file a person starts</text><text x="652" y="362" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">It loads the parts</text><text x="652" y="382" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">and talks to the user.</text><path d="M300,330 C330,330 320,200 356,200" fill="none" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="478" font-size="16" font-weight="700" fill="#213449" text-anchor="start">The rhythm:</text><rect x="150" y="456" width="150" height="34" rx="17" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="225.0" y="478" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">edit the file</text><line x1="304" y1="473" x2="336" y2="473" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="340" y="456" width="210" height="34" rx="17" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="445.0" y="478" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">save: Ctrl+S / Cmd+S</text><line x1="554" y1="473" x2="586" y2="473" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="590" y="456" width="150" height="34" rx="17" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="665.0" y="478" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">run the check</text></svg>
