<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A notebook cell lives in memory; saved files in my_foodbridge stay: parts return answers, the entry point talks to people, and the kit opens the saved file every time</title><rect width="1000" height="520" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">A cell vs a file: your system is a folder</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">A cell lives in memory. A saved .py file stays, and other code can load it.</text><rect x="30" y="96" width="270" height="168" rx="12" fill="#fbfcfd" stroke="#213449" stroke-width="2"/><path d="M31,108 a11,11 0 0 1 11,-11 H288 a11,11 0 0 1 11,11 V130 H31 Z" fill="#edf3f8"/><text x="46" y="120" font-size="16" font-weight="700" fill="#213449" text-anchor="start">Notebook in Colab</text><rect x="44" y="144" width="242" height="64" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="58" y="170" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def urgency(hours_left):</text><text x="58" y="192" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ...</text><text x="46" y="238" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">Lives in memory:</text><text x="46" y="256" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">gone when the runtime stops.</text><rect x="30" y="300" width="270" height="116" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="165" y="330" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle">The kit</text><text x="165" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">bridge.check · bridge.show</text><text x="165" y="382" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">opens your saved file,</text><text x="165" y="402" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">every time</text><rect x="340" y="114" width="630" height="320" rx="10" fill="#fff7e6" stroke="#c27c0e" stroke-width="2"/><rect x="340" y="92" width="180" height="32" rx="6" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="354" y="114" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">my_foodbridge/</text><text x="968" y="108" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="end">saved on Google Drive</text><path d="M360,136 H542 L560,154 V264 H360 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M542,136 V154 H560" fill="none" stroke="#426583" stroke-width="2"/><text x="372" y="163" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">rules.py</text><line x1="370" y1="174" x2="550" y2="174" stroke="#dde4eb" stroke-width="1.5"/><text x="372" y="198" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">URGENT_HOURS = 3</text><text x="372" y="222" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def pickup_label</text><text x="372" y="246" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def urgency</text><path d="M574,136 H756 L774,154 V264 H574 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="