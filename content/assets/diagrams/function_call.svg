<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One call traced: each parameter gets an argument&#x27;s value, return hands 9000 back, the local names vanish; a parameter is a second name for the same list</title><rect width="1000" height="650" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">One call, step by step</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Each parameter gets a value. Local names live only during the call.</text><text x="30" y="100" font-size="15" font-weight="700" fill="#213449" text-anchor="start">Your notebook</text><rect x="30" y="108" width="380" height="42" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><rect x="34" y="118" width="372" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="134" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">final = price_after_discount(10000, 10)</text><text x="430" y="100" font-size="15" font-weight="700" fill="#213449" text-anchor="start">The function</text><rect x="430" y="108" width="540" height="86" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="444" y="134" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def price_after_discount(price_riel, discount_percent):</text><rect x="434" y="140" width="532" height="22" rx="4" fill="#ffe9b8"/><text x="444" y="156" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    discount_riel = price_riel * discount_percent // 100</text><text x="444" y="178" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    return price_riel - discount_riel</text><text x="30" y="178" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">① Each parameter gets</text><text x="30" y="198" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">one argument&#x27;s value, by position</text><text x="30" y="218" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">(or by name: discount_percent=10).</text><rect x="30" y="246" width="940" height="100" rx="14" fill="#fffaf0" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="46" y="262" width="170" height="36" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="58" y="286" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">price_riel</text><text x="229" y="286" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">→</text><rect x="242" y="262" width="90" height="36" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="2"/><text x="287.0" y="285.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10000</text><rect x="356" y="262" width="170" height="36" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="368" y="286" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">discount_percent</text><text x="539" y="286" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">→</text><rect x="552" y="262" width="90" height="36" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="2"/><text x="597.0" y="285.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10</text><rect x="666" y="262" width="170" height="36" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="678" y="286" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">discount_riel</text><text x="849" y="286" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">→</text><rect x="862" y="262" width="90" height="36" rx="8" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="907.0" y="285.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1000</text><text x="46" y="332" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Inside the call</text><text x="954" y="332" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="end">these names exist only now</text><line x1="328.445" y1="150" x2="318" y2="260" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M378.10999999999996,150 C378.10999999999996,240 597,205 597,258" fill="none" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="690" y1="194" x2="690" y2="260" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="704" y="228" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">② The body makes a local name.</text><text x="46" y="384" font-size="15" font-weight="700" fill="#213449" text-anchor="start">Back in your notebook</text><rect x="46" y="394" width="170" height="36" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="58" y="418" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">final</text><text x="229" y="418" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">→</text><rect x="242" y="394" width="90" height="36" rx="8" fill="#e3f1e6" stroke="#1c7a3a" stroke-width="2"/><text x="287.0" y="417.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">9000</text><line x1="344" y1="346" x2="304" y2="392" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="360" y="378" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">③ return hands 9000 back</text><text x="600" y="406" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start">④ After the call, these names vanish.</text><text x="600" y="428" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">Using discount_riel outside gives a NameError.</text><line x1="30" y1="452" x2="970" y2="452" stroke="#dde4eb" stroke-width="1.5"/><text x="30" y="480" font-size="17" font-weight="700" fill="#213449" text-anchor="start">A parameter is a second name for the same value, not a copy</text><text x="30" y="504" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Numbers and text cannot be changed in place; a list or a dictionary can, so both names see the change.</text><text x="30" y="526" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">For a list this matters: records.remove(...) inside the function changes today_offers too.</text><text x="115" y="556" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">your code</text><text x="885" y="556" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">inside the function</text><rect x="30" y="564" width="160" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="110.0" y="587.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">today_offers</text><rect x="810" y="564" width="150" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="885.0" y="587.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">records</text><line x1="190" y1="582" x2="276" y2="582" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="810" y1="582" x2="724" y2="582" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="500" y="626" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">one list in memory, two names</text><rect x="280" y="562" width="100" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="330.0" y="587.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F001</text><rect x="390" y="562" width="100" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="440.0" y="587.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F002</text><rect x="500" y="562" width="100" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="550.0" y="587.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F003</text><rect x="610" y="562" width="100" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="660.0" y="587.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F004</text></svg>
