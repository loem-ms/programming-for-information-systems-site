<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A clean run: a cell that works only because a deleted cell left a name in memory fails after Restart session and run all, so a clean run proves nothing depends on hidden state</title><rect width="1000" height="450" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">A clean run: nothing hidden in memory</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">A notebook remembers every cell you ran, even a cell you changed or deleted later.</text><rect x="30" y="88" width="370" height="296" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="50" y="118" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">Today</text><rect x="50" y="132" width="280" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="62" y="158" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">cell 1</text><text x="142" y="158" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">import ...</text><rect x="50" y="180" width="280" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5" stroke-dasharray="6 5"/><text x="62" y="206" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">cell 2</text><text x="142" y="206" font-size="14" font-weight="700" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def helper(): ...</text><line x1="142" y1="201" x2="290" y2="201" stroke="#b3261e" stroke-width="2"/><text x="338" y="206" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start">deleted</text><rect x="50" y="228" width="280" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="62" y="254" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">cell 3</text><text x="142" y="254" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">helper()</text><text x="50" y="296" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">In memory:</text><rect x="132" y="280" width="92" height="26" rx="6" fill="#ffe9b8" stroke="#c27c0e" stroke-width="1.5"/><text x="178" y="298" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">helper</text><text x="232" y="298" font-size="14" font-weight="700" fill="#c27c0e" text-anchor="start">still there</text><text x="50" y="336" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">✅ cell 3 works today, only because</text><text x="50" y="358" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">the old helper is still in memory</text><line x1="404" y1="236" x2="592" y2="236" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="498" y="210" font-size="15" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Runtime →</text><text x="498" y="266" font-size="14" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Restart session</text><text x="498" y="286" font-size="14" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">and run all</text><rect x="600" y="88" width="370" height="296" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="620" y="118" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">After a clean run</text><text x="620" y="146" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">Memory is empty. Every cell runs, top to bottom.</text><rect x="620" y="160" width="280" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="632" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">cell 1</text><text x="712" y="186" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">import ...</text><text x="912" y="186" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">✅</text><rect x="620" y="210" width="280" height="40" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="632" y="236" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">cell 3</text><text x="712" y="236" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">helper()</text><text x="912" y="236" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">❌</text><text x="620" y="284" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">NameError: name &#x27;helper&#x27;</text><text x="620" y="304" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">is not defined</text><text x="620" y="336" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">A hidden dependency, found.</text><text x="620" y="358" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Fix: put def helper back into a cell.</text><text x="30" y="414" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Your files in my_foodbridge/ do not change: the clean run checks them from a clean start.</text><text x="30" y="438" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">Do it last, just before you submit.</text></svg>
