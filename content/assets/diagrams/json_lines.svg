<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>JSON Lines: one event per line in history.jsonl; append_event adds a line, read_events reads them all</title><rect width="1000" height="450" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="24" font-weight="700" fill="#213449" text-anchor="start">JSON Lines: a history you only add to</text><text x="30" y="74" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">One event per line. Each line is one small JSON object. Old lines never change.</text><path d="M30,100 H552 L570,118 V350 H30 Z" fill="#dbe7f1" stroke="#426583" stroke-width="2.2"/><path d="M552,100 V118 H570" fill="none" stroke="#426583" stroke-width="1.8"/><text x="42" y="124" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">history.jsonl</text><text x="52" y="156" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;step&quot;: 1, &quot;event&quot;: &quot;added&quot;, &quot;offer&quot;: &quot;F001&quot;}</text><text x="52" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;step&quot;: 2, &quot;event&quot;: &quot;added&quot;, &quot;offer&quot;: &quot;F002&quot;}</text><text x="52" y="232" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">⋮</text><text x="52" y="270" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;step&quot;: 12, &quot;event&quot;: &quot;moved&quot;, &quot;offer&quot;: &quot;F003&quot;}</text><rect x="42" y="284" width="516" height="34" rx="6" fill="#ffe9b8"/><text x="52" y="308" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;step&quot;: 13, &quot;event&quot;: &quot;moved&quot;, &quot;offer&quot;: &quot;F004&quot;}</text><rect x="620" y="106" width="350" height="104" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="636" y="138" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">read_events(path)</text><text x="636" y="166" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">reads every line: one json.loads each</text><text x="636" y="190" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">→ a list of events, oldest first</text><line x1="574" y1="158" x2="616" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="620" y="236" width="350" height="104" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="636" y="268" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">append_event(path, event)</text><text x="636" y="296" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">opens the file with &quot;a&quot;</text><text x="636" y="320" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">and adds one line at the end</text><line x1="616" y1="300" x2="562" y2="300" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="396" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">A mistake is fixed with a new line, never by changing an old one.</text><text x="30" y="426" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">(Each real line also has a detail and the time.)</text></svg>
