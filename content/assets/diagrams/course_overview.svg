<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="875" viewBox="0 0 1040 875" role="img" aria-labelledby="title desc">
<title id="title">From a food offer to an accountable handoff</title><desc id="desc">Weeks 1–4 plan pickups through quantities, review rules, batch lines and functions. Weeks 5–8 validate donor data, save plans, reserve atomically and report events. Weeks 9–10 implement a scoped improvement and hand over the system. Throughout, ask, predict, code, check evidence and revise.</desc>
