<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>app.py imports four parts: Python finds each file, runs it once and hands over the names app.py asked for</title><rect width="1100" height="500" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">import: run the file once, hand over its names</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">app.py asks four of your parts for names. Each part runs once; app.py gets the names it asked for.</text><text x="30" y="102" font-size="16" font-weight="700" fill="#213449" text-anchor="start">app.py · the entry point</text><rect x="30" y="112" width="500" height="262" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><rect x="34" y="122" width="492" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="138" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">from records import open_portions, total_portions</text><rect x="34" y="144" width="492" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="160" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">from report import most_urgent_first, public_row</text><rect x="34" y="166" width="492" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="182" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">from rules import pickup_label, urgency</text><rect x="34" y="188" width="492" height="22" rx="4" fill="#ffe9b8"/><text x="44" y="204" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">from storage import load_records</text><text x="44" y="226" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="44" y="248" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def handle_choice(choice, records):</text><text x="44" y="270" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ...</text><text x="44" y="292" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def main(): ...</text><text x="44" y="314" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="44" y="336" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if __name__ == &quot;__main__&quot;:</text><text x="44" y="358" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    main()</text><path d="M640,100 H1054 L1070,116 V162 H640 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M1054,100 V116 H1070" fill="none" stroke="#426583" stroke-width="2"/><text x="652" y="126" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">records.py</text><text x="1040" y="126" font-size="14" font-weight="700" fill="#c27c0e" text-anchor="end">runs once, top to bottom</text><text x="652" y="151" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ open_portions, total_portions</text><line x1="530" y1="133" x2="636" y2="131" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M640,174 H1054 L1070,190 V236 H640 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M1054,174 V190 H1070" fill="none" stroke="#426583" stroke-width="2"/><text x="652" y="200" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">report.py</text><text x="1040" y="200" font-size="14" font-weight="700" fill="#c27c0e" text-anchor="end">runs once, top to bottom</text><text x="652" y="225" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ most_urgent_first, public_row</text><line x1="530" y1="155" x2="636" y2="205" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M640,248 H1054 L1070,264 V310 H640 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M1054,248 V264 H1070" fill="none" stroke="#426583" stroke-width="2"/><text x="652" y="274" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">rules.py</text><text x="1040" y="274" font-size="14" font-weight="700" fill="#c27c0e" text-anchor="end">runs once, top to bottom</text><text x="652" y="299" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ pickup_label, urgency</text><line x1="530" y1="177" x2="636" y2="279" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M640,322 H1054 L1070,338 V384 H640 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M1054,322 V338 H1070" fill="none" stroke="#426583" stroke-width="2"/><text x="652" y="348" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">storage.py</text><text x="1040" y="348" font-size="14" font-weight="700" fill="#c27c0e" text-anchor="end">runs once, top to bottom</text><text x="652" y="373" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">→ load_records</text><line x1="530" y1="199" x2="636" y2="353" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M640,404 H829 L845,420 V446 H640 Z" fill="#ffffff" stroke="#b7c2cc" stroke-width="2" stroke-dasharray="6 5"/><path d="M829,404 V420 H845" fill="none" stroke="#b7c2cc" stroke-width="2"/><text x="652" y="430" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">data_model.py</text><path d="M865,404 H1054 L1070,420 V446 H865 Z" fill="#ffffff" stroke="#b7c2cc" stroke-width="2" stroke-dasharray="6 5"/><path d="M1054,404 V420 H1070" fill="none" stroke="#b7c2cc" stroke-width="2"/><text x="877" y="430" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">lifecycle.py</text><text x="1070" y="474" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="end">Parts too: your menu does not import them; start_web uses all six.</text><text x="30" y="412" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">① Python finds rules.py in the folder of the file you started.</text><text x="30" y="440" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">② It runs rules.py once, top to bottom: values set, functions made.</text><text x="30" y="468" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">③ app.py gets the names it asked for. A second import does not run it again.</text></svg>
