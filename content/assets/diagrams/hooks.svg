<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="260" viewBox="0 0 1030 260" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A hook lets your function replace a default rule; problems fall back to the default</title><rect width="1030" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="40" y="50" font-size="24" font-weight="700" fill="#213449" text-anchor="start">Hooks: your function inside the real system</text><rect x="40" y="110" width="250" height="80" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="165.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a">your pickup_label</text><text x="165.0" y="166.0" text-anchor="middle" font-size="14" fill="#1f2d3a">in your notebook</text><rect x="380" y="100" width="300" height="100" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="530.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a">System</text><text x="530.0" y="166.0" text-anchor="middle" font-size="14" fill="#1f2d3a">asks the hook for an answer</text><rect x="770" y="70" width="220" height="60" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="880.0" y="94.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3a">answer looks right</text><text x="880.0" y="116.0" text-anchor="middle" font-size="14" fill="#1f2d3a">→ used</text><rect x="770" y="170" width="220" height="60" rx="12" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.5" stroke-dasharray="6 5"/><text x="880.0" y="194.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5f6c78">crash or odd answer</text><text x="880.0" y="216.0" text-anchor="middle" font-size="14" fill="#5f6c78">→ default + warning</text><line x1="290" y1="150" x2="376" y2="150" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="333.0" y="142.0" text-anchor="middle" font-size="13" fill="#5f6c78">plug in</text><line x1="680" y1="130" x2="766" y2="100" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="680" y1="170" x2="766" y2="200" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/></svg>
