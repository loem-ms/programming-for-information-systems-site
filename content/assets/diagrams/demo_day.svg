<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Demo day: three minutes with the system poster, then a live change in six steps, then one question</title><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">Demo day: your turn</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Your system poster: the gallery view next to your drawing.</text><text x="30" y="108" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">① Three minutes with your system poster</text><rect x="50" y="122" width="150" height="44" fill="#dbe7f1" stroke="#ffffff" stroke-width="2"/><text x="125.0" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">The people</text><text x="50" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0:00</text><rect x="200" y="122" width="225" height="44" fill="#ffe9b8" stroke="#ffffff" stroke-width="2"/><text x="312.5" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">One offer&#x27;s journey</text><text x="200" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0:30</text><rect x="425" y="122" width="225" height="44" fill="#dbe7f1" stroke="#ffffff" stroke-width="2"/><text x="537.5" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">Two decisions</text><text x="425" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1:15</text><rect x="650" y="122" width="225" height="44" fill="#ffe9b8" stroke="#ffffff" stroke-width="2"/><text x="762.5" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">Your extension</text><text x="650" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2:00</text><rect x="875" y="122" width="75" height="44" fill="#dbe7f1" stroke="#ffffff" stroke-width="2"/><text x="875" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2:45</text><text x="950" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3:00</text><text x="950" y="110" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="end">A limit</text><line x1="912" y1="114" x2="912" y2="120" stroke="#5f6c78" stroke-width="1.5"/><text x="30" y="230" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">② A live change, about 2 minutes</text><rect x="50" y="246" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="72" cy="267" r="13" fill="#213449"/><text x="72" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="94" y="273" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">say the file and the name</text><line x1="340" y1="267" x2="358" y2="267" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="246" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="382" cy="267" r="13" fill="#213449"/><text x="382" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="404" y="273" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">predict: what changes, what not</text><line x1="650" y1="267" x2="668" y2="267" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="670" y="246" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="692" cy="267" r="13" fill="#213449"/><text x="692" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="714" y="273" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">edit and save</text><rect x="50" y="300" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="72" cy="321" r="13" fill="#213449"/><text x="72" y="326" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="94" y="327" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">run the live-change cell</text><line x1="340" y1="321" x2="358" y2="321" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="300" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="382" cy="321" r="13" fill="#213449"/><text x="382" y="326" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="404" y="327" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">explain any difference</text><line x1="650" y1="321" x2="668" y2="321" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="670" y="300" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="692" cy="321" r="13" fill="#213449"/><text x="692" y="326" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">6</text><text x="714" y="327" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">change it back and save</text><text x="30" y="392" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">③ One question, about 1 minute</text><text x="30" y="420" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">about any line, test or decision in your folder. Explain it in your own words.</text></svg>
