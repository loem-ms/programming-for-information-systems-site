<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Safe save: write offers.json.tmp first; a power cut leaves the old file complete; os.replace swaps the new file in one step</title><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="24" font-weight="700" fill="#213449" text-anchor="start">The safe save in three moments</text><text x="30" y="74" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">save_records never writes into the only copy.</text><rect x="30" y="96" width="290" height="270" rx="14" fill="#fbfcfd" stroke="#cfd8e0" stroke-width="1.8"/><text x="46" y="128" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">1. Write a temporary file</text><path d="M46,150 H286 L304,168 V220 H46 Z" fill="#dbe7f1" stroke="#426583" stroke-width="2.2"/><path d="M286,150 V168 H304" fill="none" stroke="#426583" stroke-width="1.8"/><text x="58" y="174" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json</text><text x="58" y="204" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">old, complete</text><path d="M46,240 H286 L304,258 V310 H46 Z" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.2"/><path d="M286,240 V258 H304" fill="none" stroke="#c27c0e" stroke-width="1.8"/><text x="58" y="264" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json.tmp</text><text x="58" y="294" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">new data: being written …</text><line x1="324" y1="230" x2="351" y2="230" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="355" y="96" width="290" height="270" rx="14" fill="#fbfcfd" stroke="#cfd8e0" stroke-width="1.8"/><text x="371" y="128" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start">⚡ Power cut during step 1?</text><path d="M371,150 H611 L629,168 V220 H371 Z" fill="#dbe7f1" stroke="#426583" stroke-width="2.2"/><path d="M611,150 V168 H629" fill="none" stroke="#426583" stroke-width="1.8"/><text x="383" y="174" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json</text><text x="383" y="204" font-size="15" font-weight="400" fill="#1c7a3a" text-anchor="start">✓ old, complete</text><path d="M371,240 H611 L629,258 V310 H371 Z" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M611,240 V258 H629" fill="none" stroke="#b7c2cc" stroke-width="1.8" stroke-dasharray="6 5"/><text x="383" y="264" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json.tmp</text><text x="383" y="294" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">✗ half written: not used</text><text x="371" y="350" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">The next start loads the old file.</text><line x1="649" y1="230" x2="676" y2="230" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="680" y="96" width="290" height="270" rx="14" fill="#fbfcfd" stroke="#cfd8e0" stroke-width="1.8"/><text x="696" y="128" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">2. os.replace swaps it in</text><path d="M696,150 H936 L954,168 V220 H696 Z" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.2"/><path d="M936,150 V168 H954" fill="none" stroke="#c27c0e" stroke-width="1.8"/><text x="708" y="174" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json</text><text x="708" y="204" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">new, complete</text><path d="M696,240 H936 L954,258 V310 H696 Z" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M936,240 V258 H954" fill="none" stroke="#b7c2cc" stroke-width="1.8" stroke-dasharray="6 5"/><text x="708" y="264" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json.tmp</text><text x="708" y="294" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">gone: it became offers.json</text><text x="696" y="350" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">Old file or new file, never half.</text><text x="30" y="410" font-size="16" font-weight="400" fill="#b3261e" text-anchor="start">Risky: open(&quot;offers.json&quot;, &quot;w&quot;) empties the only copy first. A power cut leaves half a file.</text></svg>
