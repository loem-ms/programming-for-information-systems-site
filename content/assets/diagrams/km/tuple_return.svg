<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>return offer, errors បញ្ជូន tuple មួយត្រឡប់មកវិញ ហើយកូដដែលហៅ function បំបែកវាទៅជាឈ្មោះពីរ</title><rect width="1000" height="400" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w05-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w05-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w05-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w05-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">តម្លៃពីរត្រឡប់មកវិញជាមួយគ្នា</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Python ខ្ចប់តម្លៃទាំងពីរ ទៅក្នុង tuple មួយ។ កូដដែលហៅ function បំបែក (unpack) វាទៅជាឈ្មោះពីរ តាមលំដាប់ដដែល។</text><rect x="30" y="112" width="340" height="101" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="143" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">def clean_offer(raw):</text><text x="44" y="170" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    ...</text><rect x="34" y="176" width="332" height="27" rx="4" fill="#ffe9b8"/><text x="44" y="197" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    return offer, errors</text><line x1="374" y1="176" x2="426" y2="176" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><rect x="430" y="104" width="250" height="150" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="555" y="130" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle">tuple មួយ</text><rect x="450" y="144" width="210" height="42" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="555" y="171" font-size="17" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;donor&quot;: ...}</text><line x1="664" y1="165" x2="736" y2="165" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><rect x="450" y="196" width="210" height="42" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="555" y="223" font-size="17" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">[]</text><line x1="664" y1="217" x2="736" y2="217" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><text x="815" y="130" font-size="16" font-weight="700" fill="#213449" text-anchor="middle">ឈ្មោះពីរ</text><rect x="740" y="144" width="150" height="42" rx="8" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="815" y="171" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">offer</text><rect x="740" y="196" width="150" height="42" rx="8" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="815" y="223" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">errors</text><rect x="30" y="280" width="420" height="48" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><rect x="34" y="290" width="412" height="28" rx="4" fill="#ffe9b8"/><text x="44" y="312" font-size="19" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offer, errors = clean_offer(row)</text><text x="470" y="305" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start">កូដដែលហៅ function៖ ឈ្មោះមួយ សម្រាប់តម្លៃនីមួយៗ</text><text x="30" y="368" font-size="16" font-weight="700" fill="#213449" text-anchor="start">ទម្រង់ទាំងពីរ៖</text><text x="180" y="368" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">({...}, [])</text><text x="310" y="368" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ឬ</text><text x="345" y="368" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">(None, [&quot;portions must be a whole number.&quot;])</text></svg>
