<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>JSON៖ json.dump សរសេរ list នៃ dictionary ជាអត្ថបទទៅក្នុង offers.json ហើយ json.load អានវាមកវិញ</title><rect width="1000" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="24" font-weight="700" fill="#213449" text-anchor="start">JSON៖ list និង dictionary ដែលសរសេរជាអត្ថបទ</text><text x="30" y="74" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">file ផ្ទុកបានតែអត្ថបទ។ JSON សរសេរទិន្នន័យរបស់អ្នកជាអត្ថបទ ហើយទាញយកវាមកវិញបាន។</text><text x="30" y="118" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">ក្នុងអង្គចងចាំ (memory)៖ list នៃ dictionary</text><text x="30" y="150" font-size="17" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">records</text><rect x="30" y="162" width="350" height="244" rx="14" fill="#fbfcfd" stroke="#213449" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="46" y="182" width="318" height="94" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2"/><rect x="60" y="196" width="120" height="30" rx="6" fill="#dbe7f1"/><text x="120" y="217" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;id&quot;</text><line x1="184" y1="211" x2="204" y2="211" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="208" y="196" width="140" height="30" rx="6" fill="#f5f7fa" stroke="#dde4eb"/><text x="278" y="217" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;F001&quot;</text><rect x="60" y="234" width="120" height="30" rx="6" fill="#dbe7f1"/><text x="120" y="255" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;portions&quot;</text><line x1="184" y1="249" x2="204" y2="249" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="208" y="234" width="140" height="30" rx="6" fill="#f5f7fa" stroke="#dde4eb"/><text x="278" y="255" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">30</text><rect x="46" y="296" width="318" height="94" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2"/><rect x="60" y="310" width="120" height="30" rx="6" fill="#dbe7f1"/><text x="120" y="331" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;id&quot;</text><line x1="184" y1="325" x2="204" y2="325" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="208" y="310" width="140" height="30" rx="6" fill="#f5f7fa" stroke="#dde4eb"/><text x="278" y="331" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;F002&quot;</text><rect x="60" y="348" width="120" height="30" rx="6" fill="#dbe7f1"/><text x="120" y="369" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;portions&quot;</text><line x1="184" y1="363" x2="204" y2="363" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="208" y="348" width="140" height="30" rx="6" fill="#f5f7fa" stroke="#dde4eb"/><text x="278" y="369" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">18</text><text x="640" y="118" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">នៅលើថាស (disk)៖ អត្ថបទធម្មតាក្នុង file</text><path d="M640,132 H952 L970,150 V406 H640 Z" fill="#dbe7f1" stroke="#426583" stroke-width="2.2"/><path d="M952,132 V150 H970" fill="none" stroke="#426583" stroke-width="1.8"/><text x="652" y="156" font-size="15" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offers.json</text><text x="662" y="180" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">[</text><text x="662" y="202" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">  {</text><text x="662" y="224" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    &quot;id&quot;: &quot;F001&quot;,</text><text x="662" y="246" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    &quot;portions&quot;: 30</text><text x="662" y="268" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">  },</text><text x="662" y="290" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">  {</text><text x="662" y="312" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    &quot;id&quot;: &quot;F002&quot;,</text><text x="662" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">    &quot;portions&quot;: 18</text><text x="662" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">  }</text><text x="662" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">]</text><line x1="388" y1="214" x2="632" y2="214" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="510" y="200" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">json.dump(records, file)</text><text x="510" y="238" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">ទិន្នន័យ → អត្ថបទ</text><line x1="632" y1="330" x2="388" y2="330" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="510" y="316" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">records = json.load(file)</text><text x="510" y="354" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">អត្ថបទ → ទិន្នន័យ</text><text x="30" y="448" font-size="17" font-weight="400" fill="#1f2d3a" text-anchor="start">លេខនៅតែជាលេខ៖ 30 មិនមែន &quot;30&quot; ទេ។ អត្ថបទនៅក្នុងសញ្ញាសម្រង់ (double quotes)។</text></svg>
