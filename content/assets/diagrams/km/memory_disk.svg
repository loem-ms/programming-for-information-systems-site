<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="484" viewBox="0 0 1000 484" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>អង្គចងចាំ និងថាស៖ ការចាប់ផ្ដើមឡើងវិញ (restart) ធ្វើឱ្យ variable ក្នុងអង្គចងចាំបាត់អស់ ចំណែក file នៅលើថាសនៅតែមាន</title><rect width="1000" height="484" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="24" font-weight="700" fill="#213449" text-anchor="start">អង្គចងចាំ (memory) ភ្លេច។ ថាស (disk) ចងចាំ។</text><text x="30" y="74" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ពេលចាប់ផ្ដើមឡើងវិញ (restart) អង្គចងចាំក្លាយជាទទេ។ file នៅលើថាស នៅតែមាន។</text><rect x="30" y="96" width="370" height="276" rx="14" fill="#fff8ea" stroke="#c27c0e" stroke-width="2.5"/><text x="50" y="128" font-size="21" font-weight="700" fill="#1f2d3a" text-anchor="start">អង្គចងចាំ (memory, RAM)</text><text x="50" y="157" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">លឿន ប៉ុន្តែមានតែពេលកម្មវិធីកំពុងដំណើរការ</text><rect x="50" y="176" width="100" height="38" rx="8" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="100" y="201" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">records</text><line x1="152" y1="195" x2="172" y2="195" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="176" y="176" width="206" height="38" rx="8" fill="#ffffff" stroke="#dde4eb" stroke-width="1.5"/><text x="186" y="201" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">[{&quot;id&quot;: &quot;F001&quot;}, …]</text><rect x="50" y="226" width="100" height="38" rx="8" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="100" y="251" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">events</text><line x1="152" y1="245" x2="172" y2="245" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="176" y="226" width="206" height="38" rx="8" fill="#ffffff" stroke="#dde4eb" stroke-width="1.5"/><text x="186" y="251" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">[{&quot;step&quot;: 1}, …]</text><rect x="50" y="276" width="100" height="38" rx="8" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="100" y="301" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">total</text><line x1="152" y1="295" x2="172" y2="295" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="176" y="276" width="206" height="38" rx="8" fill="#ffffff" stroke="#dde4eb" stroke-width="1.5"/><text x="186" y="301" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">100</text><text x="50" y="352" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start">✗ ក្រោយចាប់ផ្ដើមឡើងវិញ៖ ទាំងអស់នេះបាត់</text><rect x="600" y="96" width="370" height="276" rx="14" fill="#eef4f9" stroke="#426583" stroke-width="2.5"/><text x="620" y="128" font-size="21" font-weight="700" fill="#1f2d3a" text-anchor="start">ថាស (disk, Google Drive)</text><text x="620" y="157" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">យឺតជាង ប៉ុន្តែ file នៅតែមាន ក្រោយចាប់ផ្ដើមឡើងវិញ</text><text x="620" y="196" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">my_foodbridge/</text><path d="M620,212 H762 L780,230 V302 H620 Z" fill="#dbe7f1" stroke="#426583" stroke-width="2.2"/><path d="M762,