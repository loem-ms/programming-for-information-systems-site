<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>តេស្តមួយ៖ កិច្ចសន្យាផ្ដល់ចម្លើយដែលរំពឹងទុក តេស្តហៅផ្នែកនោះ ហើយ assert ប្រៀបធៀប។ វាជាប់ ឬវាធ្លាក់ ហើយអ្នកកែកូដ រួចដំណើរការវាម្ដងទៀត</title><rect width="1000" height="450" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">តេស្ត (test) គឺជាកូដដែលពិនិត្យកូដ</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ចូរសរសេរចម្លើយដែលរំពឹងទុកជាមុនសិន ពីកិច្ចសន្យា (contract)។ បន្ទាប់មក តេស្តហៅផ្នែកនោះ ហើយប្រៀបធៀប។</text><rect x="30" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="52" cy="120" r="13" fill="#213449"/><text x="52" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="74" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">កិច្ចសន្យា (contract)</text><text x="44" y="152" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">3 ម៉ោង ឬតិចជាងនេះ</text><text x="44" y="174" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">គឺបន្ទាន់ (urgent)</text><rect x="276" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="298" cy="120" r="13" fill="#213449"/><text x="298" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="320" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">ចម្លើយដែលរំពឹងទុក</text><text x="290" y="152" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">សរសេរដោយដៃ ជាមុនសិន</text><text x="290" y="184" font-size="17" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;urgent&quot;</text><rect x="522" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="544" cy="120" r="13" fill="#213449"/><text x="544" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="566" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">តេស្តហៅវា</text><text x="536" y="156" font-size="16" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">urgency(3)</text><text x="536" y="184" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">ផ្នែកនោះផ្ដល់ចម្លើយមួយ</text><rect x="768" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="790" cy="120" r="13" fill="#213449"/><text x="790" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="812" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">assert ប្រៀបធៀប</text><text x="782" y="156" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">answer ==</text><text x="782" y="180" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;urgent&quot;</text><line x1="240" y1="151" x2="272" y2="151" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="486" y1="151" x2="518" y2="151" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="732" y1="151" x2="764" y2="151" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="768" y="262" width="210" height="92" rx="12" fill="#e3f1e6" stroke="#1c7a3a" stroke-width="2.5"/><text x="873" y="296" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="middle">True → ជាប់ ✅</text><text x="873" y="322" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">គ្មានអ្វីកើតឡើងទេ</text><rect x="522" y="262" width="210" height="92" rx="12" fill="#fbe9e7" stroke="#b3261e" stroke-width="2.5"/><text x="627" y="296" font-size="16" font-weight="700" fill="#b3261e" text-anchor="middle">False → ធ្លាក់ ❌</text><text x="627" y="324" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">AssertionError</text><rect x="276" y="262" width="210" height="92" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="381" y="296" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle">កែកូដ</text><text x="381" y="322" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">អានសារ error</text><text x="381" y="342" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">រួចអានកិច្ចសន្យា</text><line x1="873" y1="206" x2="873" y2="258" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="820" y1="206" x2="700" y2="258" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="522" y1="308" x2="490" y2="308" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M330,262 C330,226 560,250 580,210" fill="none" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="592" y="240" font-size="14" font-weight="700" fill="#5f6c78" text-anchor="start">ដំណើរការម្ដងទៀត</text><text x="30" y="392" font-size="16" font-weight="700" fill="#213449" text-anchor="start">តេស្តមួយត្រូវតែអាចធ្លាក់បាន៖ ចូរសាកល្បងវាម្ដង លើកំណែ (version) ដែលមានកំហុសដាក់ដោយចេតនា។</text><text x="30" y="420" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">កុំចម្លងចម្លើយដែលរំពឹងទុក ពីលទ្ធផល (output) ឱ្យសោះ៖ ចម្លើយដែលចម្លងមក ការពារកំហុស។</text></svg>
