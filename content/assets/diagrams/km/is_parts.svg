<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>ប្រព័ន្ធព័ត៌មានរួមបញ្ចូលមនុស្ស ទិន្នន័យ វិធាន ដំណើរការ និងលទ្ធផល</title><rect width="900" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="40" y="50" font-size="24" font-weight="700" fill="#213449" text-anchor="start">ប្រព័ន្ធព័ត៌មាន = មនុស្ស + ទិន្នន័យ + វិធាន + ដំណើរការ + លទ្ធផល</text><text x="40" y="80" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ឧទាហរណ៍: Campus Food Rescue</text><rect x="60" y="120" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="180.0" y="181.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="180" y="160" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">មនុស្ស</text><text x="180" y="190" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">អ្នកបរិច្ចាគ អ្នកសម្របសម្រួល</text><text x="180" y="210" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">អ្នកស្ម័គ្រចិត្ត អង្គការដៃគូ</text><rect x="330" y="120" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="450.0" y="181.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="450" y="160" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">ទិន្នន័យ</text><text x="450" y="190" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">សំណើ: អាហារ ចំណែក</text><text x="450" y="210" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">ម៉ោងនៅសល់ ស្ថានភាព</text><rect x="600" y="120" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="720.0" y="181.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="720" y="160" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">វិធាន</text><text x="720" y="190" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">អនុម័តជាមុន; 20+ ចំណែក</text><text x="720" y="210" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">ត្រូវការក្រុម</text><rect x="330" y="290" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="450.0" y="351.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="450" y="330" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">ដំណើរការ</text><text x="450" y="360" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">សំណើ → អនុម័ត →</text><text x="450" y="380" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">ទៅយក → ប្រគល់</text><rect x="600" y="290" width="240" height="110" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="720.0" y="351.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3a"></text><text x="720" y="330" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="middle">លទ្ធផល</text><text x="720" y="360" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">បញ្ជីសម្រាប់អ្នកសម្របសម្រួល</text><text x="720" y="380" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">ក្ដារព័ត៌មានសាធារណៈ</text><rect x="60" y="290" width="240" height="110" rx="12" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.5" stroke-dasharray="6 5"/><text x="180.0" y="351.0" text-anchor="middle" font-size="19" font-weight="700" fill="#5f6c78"></text><text x="180" y="330" font-size="22" font-weight="700" fill="#5f6c78" text-anchor="middle">បច្ចេកវិទ្យា</text><text x="180" y="362" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">Python, files, ទំព័រ web:</text><text x="180" y="382" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">ជាឧបករណ៍ មិនមែនជាប្រព័ន្ធទេ</text></svg>
