<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>clean_offer ពិនិត្យជួរដើមមួយ ក្នុងប្រាំជំហាន ហើយ return ការផ្ដល់ជូនដែលស្អាត ជាមួយ list ទទេ ឬ None ជាមួយ list នៃបញ្ហា</title><rect width="1000" height="490" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w05-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w05-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w05-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w05-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="28" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ជួរដើម (raw row) នីមួយៗ ហូរកាត់ជំហានទាំងប្រាំដដែល។ ជំហានណាក៏អាចបន្ថែមសារមួយទៅក្នុង errors បាន។</text><text x="30" y="60" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start">ជួរទិន្នន័យដើមមួយ៖ dictionary ដែលមានតែអត្ថបទ</text><rect x="30" y="68" width="870" height="42" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="94" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;donor&quot;: &quot;&quot;, &quot;category&quot;: &quot; Snacks &quot;, &quot;portions&quot;: &quot;many&quot;, &quot;hours_left&quot;: &quot;6&quot;, …}</text><line x1="120" y1="112" x2="120" y2="146" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><rect x="624" y="122" width="346" height="288" rx="12" fill="#fbe4e2" stroke="#b3261e" stroke-width="2.5"/><text x="642" y="146" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">errors</text><text x="712" y="146" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">list តែមួយ ដែលកើនឡើង</text><rect x="30" y="150" width="570" height="46" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="46" y="179" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">1 · field ត្រូវតែបំពេញ</text><text x="222" y="179" font-size="15" font-weight="400" fill="#213449" text-anchor="start">field ទទេនីមួយៗ → សារមួយ</text><line x1="120" y1="197" x2="120" y2="210" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><line x1="602" y1="173" x2="636" y2="173" stroke="#b3261e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#w05-b3261e)"/><rect x="640" y="158" width="196" height="30" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="1.5"/><text x="648" y="179" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;donor is required.&quot;</text><rect x="30" y="212" width="570" height="46" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="46" y="241" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">2 · សម្អាតអត្ថបទ</text><text x="222" y="241" font-size="15" font-weight="400" fill="#213449" text-anchor="start">strip() គ្រប់អត្ថបទ ហើយ lower() category</text><line x1="120" y1="259" x2="120" y2="272" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><rect x="30" y="274" width="570" height="46" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="46" y="303" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">3 · លេខ</text><text x="222" y="303" font-size="15" font-weight="400" fill="#213449" text-anchor="start">int() ក្នុង try · ValueError → សារមួយ</text><line x1="120" y1="321" x2="120" y2="334" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><line x1="602" y1="297" x2="636" y2="297" stroke="#b3261e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#w05-b3261e)"/><rect x="640" y="282" width="322" height="30" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="1.5"/><text x="648" y="303" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;portions must be a whole number.&quot;</text><rect x="30" y="336" width="570" height="66" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="46" y="374" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">4 · ដែនកំណត់</text><text x="222" y="363" font-size="15" font-weight="400" fill="#213449" text-anchor="start">នៅក្នុង CATEGORIES? 1–200 ចំណែក? ម៉ោងនៅសល់ ≥ 1?</text><text x="222" y="386" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">(ក្នុងកូដ៖ នៅក្នុង try របស់លេខនីមួយៗ)</text><line x1="120" y1="403" x2="120" y2="416" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><line x1="797" y1="411" x2="797" y2="416" stroke="#b3261e" stroke-width="2.2" marker-end="url(#w05-b3261e)"/><rect x="30" y="418" width="940" height="56" rx="10" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="46" y="452" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">5 · return</text><text x="222" y="452" font-size="15" font-weight="400" fill="#213449" text-anchor="start">errors ទទេ →</text><text x="350" y="452" font-size="17" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">(offer, [])</text><text x="520" y="452" font-size="15" font-weight="400" fill="#213449" text-anchor="start">បើមិនដូច្នោះទេ →</text><text x="640" y="452" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">(None, errors)</text><text x="800" y="452" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">← ជួរនេះ</text></svg>
