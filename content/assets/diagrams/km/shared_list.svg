<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>parameter ដែលជាលេខ ទទួលតម្លៃថ្មីតែនៅក្នុង function ប៉ុណ្ណោះ។ parameter ដែលជា list ប្ដូរ list តែមួយនោះ ដូច្នេះ today_offers ក៏ប្ដូរដែរ។</title><rect width="1000" height="410" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">parameter ជាឈ្មោះទីពីរ សម្រាប់តម្លៃដដែល មិនមែនជាច្បាប់ចម្លងទេ</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">លេខ និងអត្ថបទ មិនអាចប្ដូរដោយផ្ទាល់ (in place) បានទេ។ list ឬ dictionary អាចប្ដូរបាន ដូច្នេះឈ្មោះទាំងពីរឃើញការប្ដូរនោះ។</text><rect x="30" y="90" width="380" height="304" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="50" y="120" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">លេខ ឬអត្ថបទ</text><rect x="50" y="134" width="170" height="44" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="64" y="162" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">price_riel = 0</text><text x="50" y="212" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">កូដរបស់អ្នក</text><rect x="50" y="220" width="130" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="115.0" y="243.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">price</text><line x1="180" y1="238" x2="246" y2="238" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="250" y="220" width="100" height="36" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="2"/><text x="300.0" y="243.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10000</text><text x="50" y="282" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">ក្នុង function</text><rect x="50" y="290" width="130" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="115.0" y="313.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">price_riel</text><line x1="182" y1="296" x2="252" y2="260" stroke="#c9d3dc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="180" y1="308" x2="246" y2="308" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="250" y="290" width="100" height="36" rx="8" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="300.0" y="313.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="50" y="358" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">ឥឡូវនេះ price_riel ចង្អុលទៅ 0។</text><text x="50" y="380" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">price នៅតែចង្អុលទៅ 10000។</text><rect x="430" y="90" width="540" height="304" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="450" y="120" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">list ឬ dictionary</text><rect x="450" y="134" width="280" height="44" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="464" y="162" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">records.remove(records[1])</text><text x="450" y="212" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">កូដរបស់អ្នក</text><rect x="450" y="220" width="150" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="525.0" y="243.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">today_offers</text><text x="450" y="282" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">ក្នុង function</text><rect x="450" y="290" width="150" height="36" rx="8" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="525.0" y="313.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">records</text><line x1="600" y1="238" x2="656" y2="264" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="600" y1="308" x2="656" y2="282" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="808" y="318" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">list តែមួយក្នុងអង្គចងចាំ ឈ្មោះពីរ</text><text x="450" y="358" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">records.remove(...) ប្ដូរ list តែមួយនោះ</text><text x="450" y="380" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">ដូច្នេះ today_offers ក៏បាត់ F002 ដែរ។</text><rect x="660" y="252" width="68" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="694.0" y="277.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F001</text><rect x="736" y="252" width="68" height="40" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="770.0" y="277.76" font-size="16" font-weight="700" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F002</text><line x1="742" y1="286" x2="798" y2="258" stroke="#b3261e" stroke-width="2.5"/><rect x="812" y="252" width="68" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="846.0" y="277.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F003</text><rect x="888" y="252" width="68" height="40" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2"/><text x="922.0" y="277.76" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">F004</text></svg>
