<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>ប្ដូរអ្វីមួយដោយចេតនា៖ កំហុសដែលដាក់ដោយចេតនា ធ្វើឱ្យតេស្តល្អធ្លាក់ ខណៈតេស្តដែលមើលមិនឃើញព្រំដែន (blind test) នៅតែជាប់។ ការសម្រេចចិត្តដែលបានប្ដូរ ទៅដល់គ្រប់អេក្រង់ និងតេស្តដែលសរសេរដោយប្រើតម្លៃថេរ (constant)</title><rect width="1000" height="480" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">ប្ដូរអ្វីមួយដោយចេតនា៖ តើអ្វីខ្លះកត់សម្គាល់ឃើញ?</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">តេស្តល្អធ្លាក់ នៅពេលកូដខូច។ ប្រព័ន្ធល្អធ្វើតាម នៅពេលការសម្រេចចិត្តប្រែប្រួល។</text><rect x="30" y="88" width="455" height="362" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="50" y="120" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">ធ្វើឱ្យកូដខូចដោយចេតនា</text><text x="50" y="152" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if hours_left &lt;= URGENT_HOURS:</text><line x1="50" y1="147" x2="322" y2="147" stroke="#5f6c78" stroke-width="1.5"/><text x="50" y="178" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if hours_left &lt; URGENT_HOURS:</text><text x="50" y="204" font-size="14" font-weight="400" fill="#b3261e" text-anchor="start">កំហុសមួយ ដែលដាក់ដោយចេតនា</text><rect x="50" y="220" width="415" height="72" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="64" y="246" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">assert urgency(URGENT_HOURS) == &quot;urgent&quot;</text><text x="64" y="276" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">❌ ធ្លាក់៖ តេស្តល្អចាប់បានកំហុស</text><rect x="50" y="304" width="415" height="72" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="64" y="330" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">assert urgency(1) == &quot;urgent&quot;</text><text x="64" y="360" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">✅ នៅតែជាប់៖ វាមិនដែលសាកល្បងចំណុចព្រំដែនទេ</text><text x="50" y="404" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">ដាក់កូដត្រឡប់មកវិញ៖ ✅ ម្ដងទៀត។</text><text x="50" y="428" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">លទ្ធផលទាំងពីរ ជាជួរដេកនៃកំណត់ត្រាការផ្ទៀងផ្ទាត់របស់អ្នក។</text><rect x="515" y="88" width="455" height="362" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="535" y="120" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">តេស្តស្ទង់មើល (canary test)៖ ប្ដូរការសម្រេចចិត្តមួយ</text><text x="535" y="154" font-size="17" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">URGENT_HOURS = 3  →  4</text><text x="535" y="180" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">កែក្នុង rules.py ហើយរក្សាទុក · app.py នៅដដែល</text><text x="535" y="216" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">menu ជម្រើសទី 1៖ F004 (នៅសល់ 4 ម៉ោង)</text><text x="535" y="238" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">✅ ក្លាយជាបន្ទាន់៖ វាធ្វើតាម</text><text x="535" y="268" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">តេស្តរបស់អ្នក ដែលសរសេរដោយប្រើ URGENT_HOURS</text><text x="535" y="290" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">✅ នៅតែជាប់៖ វាធ្វើតាម</text><text x="535" y="320" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">តេស្តដែលមានលេខសរសេរផ្ទាល់៖ urgency(4)</text><text x="535" y="342" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">❌ ធ្លាក់៖ វាលាក់លេខដែលសរសេរផ្ទាល់ (magic number)</text><text x="535" y="372" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">អេក្រង់ដែលបានចម្លងលេខ 3</text><text x="535" y="394" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">❌ នៅដដែល៖ វាជាច្បាប់ចម្លង</text><text x="535" y="428" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">ដាក់វាត្រឡប់មកវិញ ហើយរក្សាទុក៖ អ្វីៗទាំងអស់ដូចមុនវិញ។</text></svg>
