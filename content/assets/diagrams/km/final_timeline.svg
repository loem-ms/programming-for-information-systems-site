<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>កាលវិភាគនៃ Final project៖ កំណត់ហេតុគម្រោងនៅសប្ដាហ៍ទី 5 ដល់ 9 ជ្រើសផ្នែកបន្ថែមនៅសប្ដាហ៍ទី 8 ផែនការគម្រោងនៅសប្ដាហ៍ទី 9 ប្រហែល 3 ម៉ោងនៅផ្ទះ រួចសប្ដាហ៍ទី 10៖ តេស្ត និង Lab ការដាក់ស្នើនៅនាទីទី 45 និងថ្ងៃបង្ហាញប្រព័ន្ធ</title><rect width="1160" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">ពីសប្ដាហ៍ទី 5 ដល់ថ្ងៃបង្ហាញប្រព័ន្ធ</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ជំហាននីមួយៗ ផ្ដល់អ្វីដែលអ្នកត្រូវការសម្រាប់ជំហានបន្ទាប់៖ អ្នកមិនដែលចាប់ផ្ដើមរបាយការណ៍ពីទំព័រទទេទេ។</text><rect x="30" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="52" cy="116" r="13" fill="#213449"/><text x="52" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="74" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 5–9 · វគ្គទី 3</text><text x="46" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">📓 កំណត់ហេតុគម្រោង៖</text><text x="46" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">បីបន្ទាត់ រៀងរាល់សប្ដាហ៍</text><text x="46" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ឥឡូវនេះ · ការសម្រេចចិត្ត · គំនិតមួយ</text><line x1="285" y1="158" x2="306" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="310" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="332" cy="116" r="13" fill="#213449"/><text x="332" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="354" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 8 · វគ្គទី 3</text><text x="326" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ជ្រើសផ្នែកបន្ថែមរបស់អ្នក</text><text x="326" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ពីបញ្ជីផ្នែកបន្ថែមទាំងប្រាំ</text><line x1="565" y1="158" x2="586" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="590" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="612" cy="116" r="13" fill="#213449"/><text x="612" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="634" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 9 · វគ្គទី 3</text><text x="606" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ផែនការគម្រោង (project charter)៖</text><text x="606" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">កន្លះទំព័រ ជាផែនការរបស់អ្នក</text><text x="606" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">និងសេចក្ដីព្រាងដំបូងរបស់អ្នក</text><line x1="845" y1="158" x2="866" y2="158" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="870" y="92" width="255" height="132" rx="12" fill="#ffffff" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="8 5"/><circle cx="892" cy="116" r="13" fill="#213449"/><text x="892" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="914" y="122" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 9 → 10 · នៅផ្ទះ</text><text x="886" y="150" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ប្រហែល 3 ម៉ោង៖ បង្កើត</text><text x="886" y="172" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ផ្នែកបន្ថែម និងតេស្តរបស់វា</text><text x="886" y="194" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">រួចព្រាងរបាយការណ៍</text><rect x="30" y="276" width="350" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="52" cy="300" r="13" fill="#213449"/><text x="52" y="305" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="74" y="306" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 10 · វគ្គទី 1</text><text x="46" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">tests.py និង Lab៖ ការពិនិត្យសមហេតុផល</text><text x="46" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">តេស្តស្ទង់មើល និងរបៀបដែល clean run ដំណើរការ៖</text><text x="46" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ជួរដេកសម្រាប់កំណត់ត្រាការផ្ទៀងផ្ទាត់របស់អ្នក</text><line x1="380" y1="342" x2="401" y2="342" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="405" y="276" width="350" height="132" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/><circle cx="427" cy="300" r="13" fill="#213449"/><text x="427" y="305" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">6</text><text x="449" y="306" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 10 · វគ្គទី 2</text><text x="421" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">បញ្ចប់របាយការណ៍ ធ្វើ clean run ចុងក្រោយ</text><text x="421" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ដាក់ស្នើ file zip ត្រឹមនាទីទី 45</text><text x="421" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">រួចហាត់សមការបង្ហាញរបស់អ្នក</text><line x1="755" y1="342" x2="776" y2="342" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="780" y="276" width="350" height="132" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="802" cy="300" r="13" fill="#213449"/><text x="802" y="305" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">7</text><text x="824" y="306" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">សប្ដាហ៍ទី 10 · វគ្គទី 3</text><text x="796" y="334" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ថ្ងៃបង្ហាញប្រព័ន្ធ៖ 3 នាទី ការកែប្រែផ្ទាល់</text><text x="796" y="356" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">សំណួរមួយ រួចការនិយាយខ្លីៗ</text><text x="796" y="378" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">ដើម្បីក្រឡេកមើលទៅក្រោយ</text><path d="M970,224 V250 H205 V272" fill="none" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="446" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start">នាទីទី 45 នៃសប្ដាហ៍ទី 10 វគ្គទី 2 គឺជាការបិទកែប្រែកូដ (code freeze)៖ ការដាក់ស្នើតែមួយដងរបស់អ្នក។ ក្រោយនោះ អ្នកបង្ហាញ folder ដែលអ្នកបានដាក់ស្នើ។</text></svg>
