<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>ចំនួន ធៀបនឹងអត្រា៖ 12 ក្នុងចំណោម 40 គឺ 30 ភាគរយ ហើយ 6 ក្នុងចំណោម 10 គឺ 60 ភាគរយ។ ចំនួនដែលច្រើនជាង អាចមានអត្រាទាបជាង</title><rect width="1000" height="400" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">ចំនួន (count) ប្រាប់ថាមានប៉ុន្មាន។ អត្រា (rate) ប្រាប់ថា មានប៉ុន្មានក្នុងចំណោមប៉ុន្មាន?</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">រង្វង់នីមួយៗ គឺការផ្ដល់ជូនមួយ។ រង្វង់ក្រហម ត្រូវបានបដិសេធ។</text><rect x="30" y="88" width="470" height="262" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="50" y="120" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">ក្រុម A</text><text x="480" y="120" font-size="17" font-weight="700" fill="#213449" text-anchor="end">12 ក្នុងចំណោម 40</text><circle cx="70" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="112" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="154" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="196" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="238" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="280" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="322" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="364" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" stroke-width="2"/><circle cx="406" cy="152" r="14" fill="#f4c7c3" stroke="#b3261e" s