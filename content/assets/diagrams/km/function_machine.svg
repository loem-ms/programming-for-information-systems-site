<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>function ជាម៉ាស៊ីនមួយ: argument ចូល return បញ្ជូនតម្លៃមួយត្រឡប់មកវិញ ហើយ print គ្រាន់តែបង្ហាញវា</title><rect width="1000" height="460" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="44" font-size="24" font-weight="700" fill="#213449" text-anchor="start">function គឺជាម៉ាស៊ីនមួយ ដែលមានការសន្យា</text><text x="30" y="72" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">argument ចូលទៅក្នុង function។ return បញ្ជូនតម្លៃមួយត្រឡប់មកវិញ។ print គ្រាន់តែបង្ហាញវាលើអេក្រង់។</text><rect x="360" y="150" width="300" height="200" rx="18" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><rect x="375" y="98" width="270" height="68" rx="6" fill="#fffdf3" stroke="#c27c0e" stroke-width="2"/><text x="388" y="125" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;&quot;&quot;Return the price after</text><text x="388" y="151" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">the discount, in riel.&quot;&quot;&quot;</text><text x="665" y="120" font-size="16" font-weight="700" fill="#c27c0e" text-anchor="start">ស្លាក (label): docstring របស់វា</text><text x="665" y="143" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">ការសន្យា: ធាតុចូល លទ្ធផល និងអ្វីដែលមិនដែលធ្វើ</text><text x="510" y="196" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">price_after_discount</text><rect x="378" y="214" width="186" height="34" rx="6" fill="#ffffff" stroke="#426583" stroke-width="1.5"/><text x="390" y="237" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">price_riel</text><rect x="378" y="260" width="186" height="34" rx="6" fill="#ffffff" stroke="#426583" stroke-width="1.5"/><text x="390" y="283" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">discount_percent</text><text x="378" y="334" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">parameter: ឈ្មោះនៅខាងក្នុង</text><polygon points="640.0,262.0 630.5,269.7 631.8,281.8 619.7,280.5 612.0,290.0 604.3,280.5 592.2,281.8 593.5,269.7 584.0,262.0 593.5,254.3 592.2,242.2 604.3,243.5 612.0,234.0 619.7,243.5 631.8,242.2 630.5,254.3" fill="#c4d6e6" stroke="#426583" stroke-width="2"/><circle cx="612" cy="262" r="7" fill="#ffffff" stroke="#426583" stroke-width="2"/><text x="30" y="228" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">argument ចូល</text><text x="30" y="252" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">parameter នីមួយៗទទួលបាន</text><text x="30" y="272" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">តម្លៃមួយ តាមលំដាប់</text><rect x="210" y="214" width="100" height="34" rx="8" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="260.0" y="237.12" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10000</text><rect x="210" y="260" width="100" height="34" rx="8" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><text x="260.0" y="283.12" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10</text><line x1="310" y1="231" x2="374" y2="231" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="310" y1="277" x2="374" y2="277" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="660" y1="231" x2="771" y2="231" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="716" y="220" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">return</text><rect x="775" y="213" width="100" height="36" rx="8" fill="#e3f1e6" stroke="#1c7a3a" stroke-width="2"/><text x="825.0" y="237.12" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">9000</text><text x="775" y="276" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">តម្លៃមួយត្រឡប់មកវិញ</text><text x="775" y="298" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">ទៅកូដដែលហៅវា ដែលអាចរក្សាទុក</text><text x="775" y="318" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">បូក ប្រៀបធៀប ឬសាកល្បងវា</text><line x1="580" y1="350" x2="580" y2="376" stroke="#c27c0e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="592" y="370" font-size="15" font-weight="700" fill="#c27c0e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">print</text><rect x="500" y="380" width="160" height="58" rx="6" fill="#213449"/><rect x="568" y="438" width="24" height="10" fill="#5f6c78"/><text x="580" y="416" font-size="18" font-weight="700" fill="#ffe9b8" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">9000</text><text x="678" y="404" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">print គ្រាន់តែបង្ហាញលើអេក្រង់ ឱ្យមនុស្សមើល</text><text x="678" y="426" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">គ្រាន់តែ print? កូដដែលហៅវា ទទួលបាន None។</text></svg>
