<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>loop របស់ menu៖ បង្ហាញ menu ម្ដង រួចសួរ ឆ្លើយដោយ handle_choice បង្ហាញដោយ print ហើយសួរម្ដងទៀត។ q នាំទៅ break ហើយកម្មវិធីបញ្ចប់</title><rect width="1040" height="460" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">loop របស់ menu៖ សួរ ឆ្លើយ ហើយសួរម្ដងទៀត</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">while True ធ្វើម្ដងហើយម្ដងទៀតរហូត។ មានតែ break ទេដែលអាចបញ្ចប់វា ដូច្នេះអ្នកប្រើត្រូវមានផ្លូវទៅដល់ break។</text><rect x="30" y="150" width="170" height="64" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="115" y="180" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">print(MENU)</text><text x="115" y="202" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">ម្ដង នៅពេលចាប់ផ្ដើម</text><rect x="240" y="96" width="580" height="290" rx="16" fill="#fffaf0" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="200" y1="182" x2="266" y2="182" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="256" y="124" font-size="16" font-weight="700" fill="#c27c0e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">while True:</text><rect x="270" y="150" width="200" height="64" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="370" y="178" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">input(&quot;&gt; &quot;)</text><text x="370" y="200" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">រង់ចាំអ្នកប្រើចុចគ្រាប់ចុច</text><line x1="470" y1="182" x2="526" y2="182" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><polygon points="630,138 730,182 630,226 530,182" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="630" y="188" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">choice == &quot;q&quot;?</text><line x1="630" y1="226" x2="630" y2="270" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="642" y="254" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">False</text><rect x="490" y="274" width="290" height="70" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="635" y="302" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">handle_choice(choice, records)</text><text x="635" y="326" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">return អត្ថបទ</text><line x1="490" y1="309" x2="450" y2="309" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="270" y="274" width="176" height="70" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="358" y="302" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">print(...)</text><text x="358" y="326" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">បង្ហាញវា</text><line x1="320" y1="274" x2="320" y2="218" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="330" y="252" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">ជុំបន្ទាប់</text><line x1="730" y1="182" x2="856" y2="182" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="792" y="172" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">True</text><rect x="860" y="140" width="160" height="84" rx="12" fill="#e3f1e6" stroke="#1c7a3a" stroke-width="2.5"/><text x="940" y="174" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">print(&quot;Goodbye!&quot;)</text><text x="940" y="204" font-size="17" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">break</text><text x="940" y="254" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="middle">ចាកចេញពី loop៖</text><text x="940" y="274" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle">កម្មវិធីបញ្ចប់</text><text x="30" y="418" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">kit ពិនិត្យ handle_choice ដាច់ដោយឡែក៖ វា return អត្ថបទ ដូច្នេះគ្មាននរណាត្រូវវាយបញ្ចូលទេ។</text><text x="30" y="442" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">គ្មាន break ដែលអ្នកប្រើអាចទៅដល់? loop មិនដែលបញ្ចប់ទេ៖ ចូរបញ្ឈប់ cell ដោយប៊ូតុង ■។</text></svg>
