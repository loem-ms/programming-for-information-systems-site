<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>ថ្ងៃបង្ហាញប្រព័ន្ធ (Demo day)៖ បីនាទីជាមួយផ្ទាំងបង្ហាញប្រព័ន្ធ បន្ទាប់មកការកែប្រែផ្ទាល់ (live change) ជាប្រាំមួយជំហាន រួចសំណួរមួយ</title><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">ថ្ងៃបង្ហាញប្រព័ន្ធ (Demo day)៖ វេនរបស់អ្នក</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">ផ្ទាំងបង្ហាញប្រព័ន្ធ (system poster) របស់អ្នក៖ ទិដ្ឋភាព gallery នៅក្បែរគំនូររបស់អ្នក។</text><text x="30" y="108" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">① បីនាទី ជាមួយផ្ទាំងបង្ហាញប្រព័ន្ធរបស់អ្នក</text><rect x="50" y="122" width="150" height="44" fill="#dbe7f1" stroke="#ffffff" stroke-width="2"/><text x="125.0" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">មនុស្ស</text><text x="50" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0:00</text><rect x="200" y="122" width="225" height="44" fill="#ffe9b8" stroke="#ffffff" stroke-width="2"/><text x="312.5" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">ដំណើររបស់ការផ្ដល់ជូនមួយ</text><text x="200" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">0:30</text><rect x="425" y="122" width="225" height="44" fill="#dbe7f1" stroke="#ffffff" stroke-width="2"/><text x="537.5" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">ការសម្រេចចិត្តពីរ</text><text x="425" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1:15</text><rect x="650" y="122" width="225" height="44" fill="#ffe9b8" stroke="#ffffff" stroke-width="2"/><text x="762.5" y="150" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle">ផ្នែកបន្ថែមរបស់អ្នក</text><text x="650" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2:00</text><rect x="875" y="122" width="75" height="44" fill="#dbe7f1" stroke="#ffffff" stroke-width="2"/><text x="875" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2:45</text><text x="950" y="186" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3:00</text><text x="950" y="110" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="end">ដែនកំណត់មួយ</text><line x1="912" y1="114" x2="912" y2="120" stroke="#5f6c78" stroke-width="1.5"/><text x="30" y="230" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">② ការកែប្រែផ្ទាល់ (live change) ប្រហែល 2 នាទី</text><rect x="50" y="246" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="72" cy="267" r="13" fill="#213449"/><text x="72" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="94" y="273" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">ប្រាប់ឈ្មោះ file និង setting</text><line x1="340" y1="267" x2="358" y2="267" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="246" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="382" cy="267" r="13" fill="#213449"/><text x="382" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="404" y="273" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">ទាយ៖ អ្វីប្រែប្រួល អ្វីមិនប្រែប្រួល</text><line x1="650" y1="267" x2="668" y2="267" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="670" y="246" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="692" cy="267" r="13" fill="#213449"/><text x="692" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="714" y="273" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">កែ ហើយរក្សាទុក</text><rect x="50" y="300" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="72" cy="321" r="13" fill="#213449"/><text x="72" y="326" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="94" y="327" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">Run cell ការកែប្រែផ្ទាល់</text><line x1="340" y1="321" x2="358" y2="321" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="300" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="382" cy="321" r="13" fill="#213449"/><text x="382" y="326" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="404" y="327" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">ពន្យល់ភាពខុសគ្នា</text><line x1="650" y1="321" x2="668" y2="321" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="670" y="300" width="290" height="42" rx="21" fill="#ffffff" stroke="#426583" stroke-width="2"/><circle cx="692" cy="321" r="13" fill="#213449"/><text x="692" y="326" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">6</text><text x="714" y="327" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">ប្ដូរត្រឡប់មកវិញ ហើយរក្សាទុក</text><text x="30" y="392" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">③ សំណួរមួយ ប្រហែល 1 នាទី</text><text x="30" y="420" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">អំពីបន្ទាត់កូដ តេស្ត ឬការសម្រេចចិត្តណាមួយ នៅក្នុង folder របស់អ្នក។ ចូរពន្យល់វាតាមពាក្យរបស់អ្នកផ្ទាល់។</text></svg>
