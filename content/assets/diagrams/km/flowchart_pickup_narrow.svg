<svg xmlns="http://www.w3.org/2000/svg" width="690" height="510" viewBox="0 0 690 510" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>flowchart (គំនូសតាងលំហូរ) នៃ pickup_label: បើមិន approved → &quot;hold&quot;; បើ portions ≥ TEAM_PICKUP_MIN_PORTIONS → &quot;team&quot;; ក្រៅពីនេះ → &quot;standard&quot;</title><rect width="1000" height="510" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><ellipse cx="200" cy="45" rx="70" ry="24" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="200" y="51" font-size="17" font-weight="700" fill="#213449" text-anchor="middle">ចាប់ផ្ដើម</text><line x1="200" y1="69" x2="200" y2="104" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><polygon points="200,107 350,165 200,223 50,165" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="200" y="171" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d3a">approved?</text><line x1="350" y1="165" x2="476" y2="165" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="410" y="155" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="middle">មិនមែន</text><rect x="480" y="141" width="190" height="48" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="575" y="171" text-anchor="middle" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#1f2d3a">return &quot;hold&quot;</text><line x1="200" y1="223" x2="200" y2="262" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="214" y="248" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start">មែន</text><polygon points="200,265 390,335 200,405 10,335" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="200" y="330" text-anchor="middle" font-size="