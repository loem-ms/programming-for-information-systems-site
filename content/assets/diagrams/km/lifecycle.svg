<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>lifecycle របស់សំណើ: new, approved, picked_up, delivered ឬ rejected ឬ cancelled</title><rect width="1000" height="380" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="40" y="50" font-size="24" font-weight="700" fill="#213449" text-anchor="start">lifecycle របស់សំណើ</text><text x="40" y="80" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">អនុញ្ញាតតែការប្ដូរទាំងនេះប៉ុណ្ណោះ។ ក្រៅពីនេះត្រូវបានបដិសេធ។</text><rect x="60" y="130" width="180" height="64" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="150.0" y="168.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3a">new</text><rect x="300" y="130" width="180" height="64" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="390.0" y="168.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3a">approved</text><rect x="540" y="130" width="180" height="64" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="630.0" y="168.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3a">picked_up</text><rect x="780" y="130" width="180" height="64" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="870.0" y="168.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3a">delivered</text><rect x="60" y="290" width="180" height="64" rx="12" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.5" stroke-dasharray="6 5"/><text x="150.0" y="328.0" text-anchor="middle" font-size="20" font-weight="700" fill="#5f6c78">rejected</text><rect x="300" y="290" width="180" height="64" rx="12" fill="#f4f6f8" stroke="#b7c2cc" stroke-width="2.5" stroke-dasharray="6 5"/><text x="390.0" y="328.0" text-anchor="middle" font-size="20" font-weight="700" fill="#5f6c78">cancelled</text><line x1="240" y1="162" x2="296" y2="162" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="268.0" y="154.0" text-anchor="middle" font-size="13" fill="#5f6c78">អនុម័ត</text><line x1="480" y1="162" x2="536" y2="162" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="508.0" y="154.0" text-anchor="middle" font-size="13" fill="#5f6c78">ទៅយក</text><line x1="720" y1="162" x2="776" y2="162" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="748.0" y="154.0" text-anchor="middle" font-size="13" fill="#5f6c78">ប្រគល់</text><line x1="150" y1="194" x2="150" y2="286" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="390" y1="194" x2="390" y2="286" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="160" y="245" font-size="13" font-weight="400" fill="#5f6c78" text-anchor="start">បដិសេធ</text><text x="400" y="245" font-size="13" font-weight="400" fill="#5f6c78" text-anchor="start">លុបចោល</text><text x="540" y="270" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">✗ new → delivered មិនត្រូវបានអនុញ្ញាតទេ</text><text x="540" y="296" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">✗ delivered → new មិនត្រូវបានអនុញ្ញាតទេ</text></svg>
