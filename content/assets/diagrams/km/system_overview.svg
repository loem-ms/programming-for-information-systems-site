<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>ដំណើររបស់ការផ្ដល់ជូនមួយ៖ ច្រកពិនិត្យទិន្នន័យចូលទទួលយកវា lifecycle ប្ដូរស្ថានភាពវា ផ្នែករក្សាទុករក្សាទុកវា report តម្រៀប និងច្រោះវា ហើយ app.py បង្ហាញវាដល់អ្នកសម្របសម្រួល</title><rect width="1160" height="480" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">ដំណើររបស់ការផ្ដល់ជូនមួយ ឆ្លងកាត់ file របស់អ្នក</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">F004៖ Lotus Cafe ផ្ដល់ការីបន្លែជាមួយបាយ 12 ចំណែក។ file នីមួយៗធ្វើការងារមួយ រួចបញ្ជូនការផ្ដល់ជូននោះបន្ត។</text><path d="M30,98 H206 L222,114 V284 H30 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M206,98 V114 H222" fill="none" stroke="#426583" stroke-width="2"/><text x="42" y="124" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">data_model.py</text><line x1="40" y1="136" x2="212" y2="136" stroke="#dde4eb" stroke-width="1.5"/><text x="42" y="162" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">ច្រកពិនិត្យទិន្នន័យចូល</text><text x="42" y="190" font-size="14" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">clean_offer(raw)</text><text x="42" y="226" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">សម្អាតជួរដេក</text><text x="42" y="248" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">ហើយទទួលយកវា</text><line x1="222" y1="190" x2="248" y2="190" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M252,98 H428 L444,114 V284 H252 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M428,98 V114 H444" fill="none" stroke="#426583" stroke-width="2"/><text x="264" y="124" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">lifecycle.py</text><line x1="262" y1="136" x2="434" y2="136" stroke="#dde4eb" stroke-width="1.5"/><text x="264" y="162" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">ការប្ដូរដែលអនុញ្ញាត</text><text x="264" y="190" font-size="14" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">can_move(...)</text><text x="264" y="226" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">new → approved:</text><text x="264" y="248" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">អ្នកសម្របសម្រួលយល់ព្រម</text><line x1="444" y1="190" x2="470" y2="190" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M474,98 H650 L666,114 V284 H474 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M650,98 V114 H666" fill="none" stroke="#426583" stroke-width="2"/><text x="486" y="124" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">storage.py</text><line x1="484" y1="136" x2="656" y2="136" stroke="#dde4eb" stroke-width="1.5"/><text x="486" y="162" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">ការរក្សាទុក ប្រវត្តិ</text><text x="486" y="190" font-size="14" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">save_records(...)</text><text x="486" y="226" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">រក្សាទុកលើថាស (disk)</text><text x="486" y="248" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">និងបន្ទាត់ប្រវត្តិមួយ</text><line x1="666" y1="190" x2="692" y2="190" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M696,98 H872 L888,114 V284 H696 Z" fill="#ffffff" stroke="#426583" stroke-width="2"/><path d="M872,98 V114 H888" fill="none" stroke="#426583" stroke-width="2"/><text x="708" y="124" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">report.py</text><line x1="706" y1="136" x2="878" y2="136" stroke="#dde4eb" stroke-width="1.5"/><text x="708" y="162" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">នរណាឃើញអ្វី</text><text x="708" y="190" font-size="14" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">most_urgent_first</text><text x="708" y="226" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">នៅខាងលើគេក្នុងបញ្ជី</text><text x="708" y="248" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">សាធារណៈ៖ គ្មានទំនាក់ទំនង</text><line x1="888" y1="190" x2="914" y2="190" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M918,98 H1094 L1110,114 V284 H918 Z" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2"/><path d="M1094,98 V114 H1110" fill="none" stroke="#c27c0e" stroke-width="2"/><text x="930" y="124" font-size="16" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">app.py</text><line x1="928" y1="136" x2="1100" y2="136" stroke="#dde4eb" stroke-width="1.5"/><text x="930" y="162" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">file ចាប់ផ្ដើម</text><text x="930" y="190" font-size="14" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">handle_choice(...)</text><text x="930" y="226" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">ជម្រើសទី 1 នៃ menu៖</text><text x="930" y="248" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="start">អ្នកសម្របសម្រួលឃើញវា</text><rect x="55" y="352" width="140" height="50" rx="25" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="125.0" y="383.0" text-anchor="middle" font-size="16" font-weight="700" fill="#213449">អ្នកបរិច្ចាគ</text><line x1="125" y1="350" x2="125" y2="288" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="135" y="326" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">ផ្ដល់ជូនអាហារ</text><rect x="474" y="356" width="186" height="40" rx="8" fill="#f5f7fa" stroke="#c9d3dc" stroke-width="2"/><text x="567" y="382" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">saved/offers.json</text><line x1="567" y1="286" x2="567" y2="352" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="706" y="352" width="170" height="50" rx="25" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="791.0" y="383.0" text-anchor="middle" font-size="16" font-weight="700" fill="#213449">ក្ដារព័ត៌មានសាធារណៈ</text><line x1="791" y1="286" x2="791" y2="348" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="801" y="326" font-size="14" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">public_row</text><rect x="938" y="352" width="170" height="50" rx="25" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="1023.0" y="383.0" text-anchor="middle" font-size="16" font-weight="700" fill="#213449">អ្នកសម្របសម្រួល</text><line x1="1023" y1="286" x2="1023" y2="348" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="30" y="452" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">app.py ក៏ import rules.py (urgency, pickup_label) និង records.py (ផលបូកសរុប) ដែរ។ ប្រសិនបើអ្នកប្ដូរវិធានមួយនៅក្នុង file របស់វា menu ក៏ប្ដូរតាមដែរ។</text></svg>
