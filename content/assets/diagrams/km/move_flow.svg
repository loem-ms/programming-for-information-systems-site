<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer UI', 'Khmer OS Battambang', Helvetica, Arial, sans-serif"><title>ការចុចរបស់អ្នកស្ម័គ្រចិត្ត ហៅ offer.move_to ដែលសួរ can_move របស់អ្នក។ ALLOWED_MOVES ឆ្លើយ True ឬ False</title><rect width="1000" height="500" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w06-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w06-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w06-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w06-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">តើ file របស់សប្ដាហ៍នេះដំណើរការយ៉ាងដូចម្ដេច</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Offer របស់ kit សួរវិធានរបស់អ្នក មុនគ្រប់ការប្ដូរ។</text><rect x="30" y="96" width="620" height="50" rx="10" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="48" y="127" font-size="16" font-weight="700" fill="#213449" text-anchor="start">អ្នកស្ម័គ្រចិត្តម្នាក់ចុច &quot;បានទៅយក&quot; លើ F004 (status: approved)។</text><text x="680" y="127" font-size="16" font-weight="700" fill="#213449" text-anchor="start">នៅលើទូរស័ព្ទរបស់អ្នកស្ម័គ្រចិត្ត</text><rect x="30" y="176" width="620" height="50" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="48" y="207" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">offer.move_to(&quot;picked_up&quot;, can_move)</text><text x="680" y="207" font-size="16" font-weight="700" fill="#213449" text-anchor="start">object Offer របស់ kit</text><rect x="30" y="256" width="620" height="50" rx="10" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="48" y="287" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">can_move(&quot;approved&quot;, &quot;picked_up&quot;)</text><text x="680" y="287" font-size="16" font-weight="700" fill="#213449" text-anchor="start">lifecycle.py របស់អ្នក៖ វិធាន</text><rect x="30" y="336" width="620" height="50" rx="10" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="48" y="367" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">ALLOWED_MOVES.get(&quot;approved&quot;, [])  →  [&quot;picked_up&quot;, &quot;cancelled&quot;]</text><text x="680" y="367" font-size="16" font-weight="700" fill="#213449" text-anchor="start">lifecycle.py របស់អ្នក៖ ទិន្នន័យ</text><polyline points="70,148 70,174" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><polyline points="70,228 70,254" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><text x="84" y="247" font-size="15" font-weight="400" fill="#213449" text-anchor="start">សួរវិធាន</text><polyline points="70,308 70,334" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><text x="84" y="327" font-size="15" font-weight="400" fill="#213449" text-anchor="start">រកមើល list</text><polyline points="340,386 340,400 180,400 180,414" fill="none" stroke="#1c7a3a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#w06-1c7a3a)"/><polyline points="340,400 500,400 500,414" fill="none" stroke="#b3261e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#w06-b3261e)"/><rect x="30" y="418" width="300" height="72" rx="10" fill="#e3f4e8" stroke="#1c7a3a" stroke-width="2.5"/><text x="48" y="446" font-size="17" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">True</text><text x="48" y="474" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">status ក្លាយជា &quot;picked_up&quot;</text><rect x="350" y="418" width="300" height="72" rx="10" fill="#fbe4e2" stroke="#b3261e" stroke-width="2.5"/><text x="368" y="446" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">False</text><text x="368" y="474" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">គ្មានអ្វីប្រែប្រួលទេ ហើយអេក្រង់ប្រាប់មូលហេតុ</text></svg>
