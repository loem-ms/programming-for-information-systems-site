<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A test: the contract gives the expected answer, the test calls the part, assert compares; it passes, or it fails and you fix the code and run it again</title><rect width="1000" height="450" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">A test is code that checks code</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Write the expected answer first, from the contract. Then the test calls the part and compares.</text><rect x="30" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="52" cy="120" r="13" fill="#213449"/><text x="52" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="74" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">The contract</text><text x="44" y="152" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">3 hours or less</text><text x="44" y="174" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">is urgent</text><rect x="276" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="298" cy="120" r="13" fill="#213449"/><text x="298" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="320" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">Expected answer</text><text x="290" y="152" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">written first, by hand</text><text x="290" y="184" font-size="17" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;urgent&quot;</text><rect x="522" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="544" cy="120" r="13" fill="#213449"/><text x="544" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="566" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">The test calls it</text><text x="536" y="156" font-size="16" font-weight="700" fill="#426583" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">urgency(3)</text><text x="536" y="184" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">the part gives an answer</text><rect x="768" y="96" width="210" height="110" rx="12" fill="#ffffff" stroke="#426583" stroke-width="2.5"/><circle cx="790" cy="120" r="13" fill="#213449"/><text x="790" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="812" y="126" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="start">assert compares</text><text x="782" y="156" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">answer ==</text><text x="782" y="180" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;urgent&quot;</text><line x1="240" y1="151" x2="272" y2="151" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="486" y1="151" x2="518" y2="151" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="732" y1="151" x2="764" y2="151" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="768" y="262" width="210" height="92" rx="12" fill="#e3f1e6" stroke="#1c7a3a" stroke-width="2.5"/><text x="873" y="296" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="middle">True: it passes ✅</text><text x="873" y="322" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">nothing happens</text><rect x="522" y="262" width="210" height="92" rx="12" fill="#fbe9e7" stroke="#b3261e" stroke-width="2.5"/><text x="627" y="296" font-size="16" font-weight="700" fill="#b3261e" text-anchor="middle">False: it fails ❌</text><text x="627" y="324" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">AssertionError</text><rect x="276" y="262" width="210" height="92" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="381" y="296" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle">Fix the code</text><text x="381" y="322" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">read the message,</text><text x="381" y="342" font-size="14" font-weight="400" fill="#1f2d3a" text-anchor="middle">then the contract</text><line x1="873" y1="206" x2="873" y2="258" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="820" y1="206" x2="700" y2="258" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="522" y1="308" x2="490" y2="308" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M330,262 C330,226 560,250 580,210" fill="none" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#arrow)"/><text x="592" y="240" font-size="14" font-weight="700" fill="#5f6c78" text-anchor="start">run again</text><text x="30" y="392" font-size="16" font-weight="700" fill="#213449" text-anchor="start">A test must be able to fail: try it once on a version with a bug planted on purpose.</text><text x="30" y="420" font-size="15" font-weight="400" fill="#b3261e" text-anchor="start">Never copy the expected answer from the output: a copied answer protects the bug.</text></svg>
