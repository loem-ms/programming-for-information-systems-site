<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A method such as strip or lower makes new text; the original value is unchanged</title><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w05-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w05-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w05-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w05-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">A method makes new text</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">A method belongs to a value: you write it after a dot. The original never changes.</text><rect x="30" y="108" width="230" height="76" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="145" y="155" font-size="24" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;  Bread &quot;</text><text x="145" y="210" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle">the original</text><rect x="385" y="108" width="230" height="76" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="500" y="155" font-size="24" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;Bread&quot;</text><text x="500" y="210" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle">new text: no spaces at the ends</text><rect x="740" y="108" width="230" height="76" rx="12" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="855" y="155" font-size="24" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;bread&quot;</text><text x="855" y="210" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="middle">new text: small letters</text><line x1="266" y1="146" x2="380" y2="146" stroke="#213449" stroke-width="2.2" marker-end="url(#w05-213449)"/><text x="323" y="134" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">.strip()</text><line x1="621" y1="146" x2="735" y2="146" stroke="#213449" stroke-width="2.2" marker-end="url(#w05-213449)"/><text x="678" y="134" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">.lower()</text><rect x="30" y="252" width="420" height="128" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="283" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">typed = &quot;  Bread &quot;</text><rect x="34" y="289" width="412" height="27" rx="4" fill="#ffe9b8"/><text x="44" y="310" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">clean = typed.strip().lower()</text><text x="44" y="337" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">print(clean)</text><text x="44" y="364" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">print(typed)</text><text x="490" y="266" font-size="17" font-weight="700" fill="#213449" text-anchor="start">Two names, two values</text><rect x="490" y="286" width="110" height="44" rx="8" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="545" y="315" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">typed</text><line x1="604" y1="308" x2="656" y2="308" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><rect x="660" y="286" width="160" height="44" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="740" y="315" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;  Bread &quot;</text><text x="834" y="314" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start">unchanged</text><rect x="490" y="344" width="110" height="44" rx="8" fill="#ffffff" stroke="#213449" stroke-width="2.5"/><text x="545" y="373" font-size="18" font-weight="700" fill="#213449" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">clean</text><line x1="604" y1="366" x2="656" y2="366" stroke="#5f6c78" stroke-width="2.2" marker-end="url(#w05-5f6c78)"/><rect x="660" y="344" width="160" height="44" rx="8" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="740" y="373" font-size="18" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&quot;bread&quot;</text><text x="834" y="372" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">the new text</text><text x="30" y="420" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">✗</text><text x="54" y="420" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">typed.strip()</text><text x="200" y="420" font-size="16" font-weight="400" fill="#b3261e" text-anchor="start">on a line of its own: the new text is made, then lost. Give it a name.</text></svg>
