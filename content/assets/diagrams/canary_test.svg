<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Change one thing on purpose: a planted bug makes a good test fail while a blind test passes; a changed decision reaches every screen and the tests written with the constant</title><rect width="1000" height="480" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="40" font-size="24" font-weight="700" fill="#213449" text-anchor="start">Change one thing on purpose: who notices?</text><text x="30" y="68" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">A good test fails when the code breaks. A good system follows when a decision changes.</text><rect x="30" y="88" width="455" height="362" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="50" y="120" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">Break the code on purpose</text><text x="50" y="152" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if hours_left &lt;= URGENT_HOURS:</text><line x1="50" y1="147" x2="322" y2="147" stroke="#5f6c78" stroke-width="1.5"/><text x="50" y="178" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">if hours_left &lt; URGENT_HOURS:</text><text x="50" y="204" font-size="14" font-weight="400" fill="#b3261e" text-anchor="start">a bug, planted on purpose</text><rect x="50" y="220" width="415" height="72" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="64" y="246" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">assert urgency(URGENT_HOURS) == &quot;urgent&quot;</text><text x="64" y="276" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">❌ fails: a good test caught the bug</text><rect x="50" y="304" width="415" height="72" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="64" y="330" font-size="14" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">assert urgency(1) == &quot;urgent&quot;</text><text x="64" y="360" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">✅ still passes: it never tries the edge</text><text x="50" y="404" font-size="15" font-weight="700" fill="#1f2d3a" text-anchor="start">Put the code back: ✅ again.</text><text x="50" y="428" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">Both results are rows of your verification log.</text><rect x="515" y="88" width="455" height="362" rx="14" fill="#f7f9fb" stroke="#dde4eb" stroke-width="1.5"/><text x="535" y="120" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start">The canary: change one decision</text><text x="535" y="154" font-size="17" font-weight="700" fill="#213449" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">URGENT_HOURS = 3  →  4</text><text x="535" y="180" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">in rules.py, saved; app.py does not change</text><text x="535" y="216" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">The menu, choice 1: F004 (4 hours left)</text><text x="535" y="238" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">✅ turns urgent: it follows</text><text x="535" y="268" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">Your tests written with URGENT_HOURS</text><text x="535" y="290" font-size="15" font-weight="700" fill="#1c7a3a" text-anchor="start">✅ still pass: they follow</text><text x="535" y="320" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">A test with a raw number: urgency(4)</text><text x="535" y="342" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">❌ fails: it hid a magic number</text><text x="535" y="372" font-size="15" font-weight="400" fill="#1f2d3a" text-anchor="start">A screen that copied the 3</text><text x="535" y="394" font-size="15" font-weight="700" fill="#b3261e" text-anchor="start">❌ stays the same: a copy</text><text x="535" y="428" font-size="14" font-weight="400" fill="#5f6c78" text-anchor="start">Set it back and save: everything looks as before.</text></svg>
