<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A while loop checks its condition before every round and leaves when it is False</title><rect width="1000" height="500" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><defs><marker id="w06-b3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="w06-1c7a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7a3a"/></marker><marker id="w06-213449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#213449"/></marker><marker id="w06-5f6c78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6c78"/></marker></defs><text x="30" y="46" font-size="26" font-weight="700" fill="#213449" text-anchor="start">while: check, run the body, check again</text><text x="30" y="76" font-size="16" font-weight="400" fill="#5f6c78" text-anchor="start">Python checks the condition before every round. When it is False, the loop ends.</text><rect x="30" y="98" width="260" height="72" rx="10" fill="#f5f7fa" stroke="#dde4eb" stroke-width="1.5"/><text x="44" y="128" font-size="17" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">balance = 5000</text><text x="44" y="154" font-size="17" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">days = 0</text><polyline points="160,170 160,206" fill="none" stroke="#5f6c78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-5f6c78)"/><polygon points="160,210 290,270 160,330 30,270" fill="#ffe9b8" stroke="#c27c0e" stroke-width="2.5"/><text x="160" y="276" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">balance &gt;= 1500</text><polyline points="290,270 386,270" fill="none" stroke="#1c7a3a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#w06-1c7a3a)"/><text x="338" y="260" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">True</text><text x="390" y="228" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">the body</text><rect x="390" y="236" width="290" height="72" rx="12" fill="#dbe7f1" stroke="#426583" stroke-width="2.5"/><text x="406" y="264" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">balance = balance - 1500</text><text x="406" y="292" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">days = days + 1</text><polyline points="535,236 535,196 222,196 222,234" fill="none" stroke="#213449" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#w06-213449)"/><text x="378" y="188" font-size="15" font-weight="400" fill="#213449" text-anchor="middle">back to the check</text><polyline points="160,330 160,380" fill="none" stroke="#b3261e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#w06-b3261e)"/><text x="172" y="362" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">False</text><rect x="30" y="384" width="260" height="48" rx="8" fill="#ffffff" stroke="#b7c2cc" stroke-width="2.5"/><text x="160" y="414" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">print(days, balance)</text><text x="160" y="456" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="middle">after the loop</text><text x="712" y="120" font-size="17" font-weight="700" fill="#213449" text-anchor="start">Trace it by hand</text><text x="712" y="154" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start">round</text><text x="772" y="154" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">balance</text><text x="850" y="154" font-size="15" font-weight="700" fill="#5f6c78" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">balance &gt;= 1500</text><line x1="712" y1="166" x2="985" y2="166" stroke="#d9e1e8" stroke-width="1.5"/><text x="732" y="189" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="772" y="189" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">5000</text><text x="850" y="189" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">True</text><line x1="712" y1="200" x2="985" y2="200" stroke="#d9e1e8" stroke-width="1.5"/><text x="732" y="223" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="772" y="223" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">3500</text><text x="850" y="223" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">True</text><line x1="712" y1="234" x2="985" y2="234" stroke="#d9e1e8" stroke-width="1.5"/><text x="732" y="257" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="772" y="257" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">2000</text><text x="850" y="257" font-size="16" font-weight="700" fill="#1c7a3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">True</text><line x1="712" y1="268" x2="985" y2="268" stroke="#d9e1e8" stroke-width="1.5"/><text x="732" y="291" font-size="16" font-weight="700" fill="#1f2d3a" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="772" y="291" font-size="16" font-weight="400" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">500</text><text x="850" y="291" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">False</text><line x1="712" y1="302" x2="985" y2="302" stroke="#d9e1e8" stroke-width="1.5"/><text x="712" y="336" font-size="15" font-weight="400" fill="#5f6c78" text-anchor="start">printed:</text><text x="712" y="366" font-size="18" font-weight="700" fill="#1f2d3a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">3 500</text><text x="30" y="488" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">✗</text><text x="54" y="488" font-size="16" font-weight="400" fill="#b3261e" text-anchor="start">If the body never changes the condition, the loop never ends. Stop it with ■.</text></svg>
