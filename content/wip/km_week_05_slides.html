const STORE = "pfis-wip-key";
const form = document.getElementById("f"), message = document.getElementById("m");
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const text = (a) => btoa(String.fromCharCode.apply(null, a));
function saved() { try { return sessionStorage.getItem(STORE) || localStorage.getItem(STORE); } catch (e) { return null; } }
function keep(raw, remember) { try { sessionStorage.setItem(STORE, text(raw)); if (remember) localStorage.setItem(STORE, text(raw)); } catch (e) {} }
function forget() { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {} }
async function derive(passcode) {
  const clean = passcode.toLowerCase().replace(/[\s-]/g, "");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(LOCK.salt), iterations: LOCK.iterations, hash: "SHA-256" }, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCK.iv) }, key, bytes(LOCK.data)));
}
function show(page) { document.open(); document.write(page); document.close(); }
(async function () {
  if (!window.crypto || !crypto.subtle) { form.hidden = false; message.textContent = "This browser cannot open locked pages here (it needs HTTPS)."; return; }
  const stored = saved();
  if (stored) { try { show(await decrypt(bytes(stored))); return; } catch (e) { forget(); } }
  form.hidden = false;
})();
form.addEventListener("submit", async function (event) {
  event.preventDefault();
  message.textContent = "Opening…";
  try {
    const raw = await derive(document.getElementById("p").value);
    const page = await decrypt(raw);
    keep(raw, document.getElementById("r").checked);
    show(page);
  } catch (e) { message.textContent = "That passcode did not work. Try again."; }
});
</script></body></html>
