<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc">
<title id="title">Make a coordination rule reusable</title><desc id="desc">Two callers provide explicit inputs to a shared policy function. It returns hold, standard or team. The caller chooses display and workflow; importing the function should not start a pickup.</desc>
