<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
<title id="title">Report stages without adding overlapping totals</title><desc id="desc">The final fixture declares 94 offered planning portions, reserves 60, collects 42 and delivers 29. Each later stage is a subset of the earlier stage. Stage totals overlap; do not add them or call planned portions people served.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="590" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 08  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Report stages without adding overlapping totals</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="250,210 290,210" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,210 540,210" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,210 790,210" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Offered: 94</tspan></text><text x="145.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Declared planning units</tspan></text><rect x="290" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Reserved: 60</tspan></text><text x="395.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Accepted commitments</tspan></text><rect x="540" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Collected: 42</tspan></text><text x="645.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Explicit pickup events</tspan></text><rect x="790" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Delivered: 29</tspan></text><text x="895.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Explicit delivery events</tspan></text><rect x="80" y="355" width="880" height="125" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="520.0" y="387" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Partition the opening quantity</tspan></text><text x="520.0" y="416" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">34 available + 18 reserved only</tspan><tspan x="520.0" dy="22.950000000000003">+ 13 collected, not delivered + 29 delivered = 94</tspan></text><text x="520" y="545" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">This partition assumes the fixture has whole-reservation events.</tspan><tspan x="520" dy="22.950000000000003">Partial collection, loss and mixed units require a richer model.</tspan></text></g></svg>