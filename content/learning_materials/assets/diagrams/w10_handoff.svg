<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">Make the next volunteer independent</title><desc id="desc">Identify known inputs, reset deliberately and document the run order. Compare actual stage totals and availability with expectations. If they differ, find the first mismatch and retest.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="620" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 10  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Make the next volunteer independent</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="250,195 290,195" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,195 540,195" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,195 790,195" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="895,245 895,385 750,385" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="540,385 480,385" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="487.5" y="348" width="45" height="24" rx="6" fill="#ffffff"/><text x="510" y="365" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="510" dy="0">Yes</tspan></text><polyline points="645,440 645,500" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="656.0" y="461" width="36" height="24" rx="6" fill="#ffffff"/><text x="674" y="478" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="674" dy="0">No</tspan></text><polyline points="520,550 90,550 90,285 395,285 395,245" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="40" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Known inputs</tspan></text><text x="145.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Identify the fixture</tspan></text><rect x="290" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Clean start</tspan></text><text x="395.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Reset deliberately</tspan></text><rect x="540" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Documented steps</tspan></text><text x="645.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Follow the run order</tspan></text><rect x="790" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Observed state</tspan></text><text x="895.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Record stage evidence</tspan></text><path d="M645.0,330 L750,385.0 L645.0,440 L540,385.0 Z" fill="#fff4df" stroke="#986714" stroke-width="1.8"/><text x="645.0" y="380.0" text-anchor="middle" font-size="18" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Matches</tspan><tspan x="645.0" dy="24.3">expectation?</tspan></text><rect x="230" y="335" width="250" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="355.0" y="367" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="355.0" dy="0">Handoff evidence</tspan></text><text x="355.0" y="396" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="355.0" dy="0">Another volunteer can verify</tspan></text><rect x="520" y="500" width="250" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="645.0" y="532" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Diagnose and retest</tspan></text><text x="645.0" y="561" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Find the first difference</tspan></text></g></svg>