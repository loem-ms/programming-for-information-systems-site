<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Trace a reported delivery to its evidence</title><desc id="desc">A delivery report requires an accepted reservation, its snapshotted lines, a collection event and a delivery event. Reservation arithmetic alone cannot establish delivery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="500" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 10  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Trace a reported delivery to its evidence</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="250,210 290,210" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,210 540,210" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,210 790,210" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="895,270 895,400 750,400" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Reservation ID</tspan></text><text x="145.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Accepted whole pickup</tspan></text><rect x="290" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Line snapshots</tspan></text><text x="395.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Declared unit × count</tspan></text><rect x="540" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Collection event</tspan></text><text x="645.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Pickup recorded</tspan></text><rect x="790" y="155" width="210" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Delivery event</tspan></text><text x="895.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Delivery confirmed</tspan></text><rect x="290" y="350" width="460" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="520.0" y="382" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Reported delivered portions</tspan></text><text x="520.0" y="411" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">Sum only lines linked to delivery evidence</tspan></text><text x="520" y="485" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">A status record is auditable evidence, not a claim about unique people served.</tspan></text></g></svg>