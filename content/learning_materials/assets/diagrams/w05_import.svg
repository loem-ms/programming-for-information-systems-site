<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">Turn donor rows into auditable proposals</title><desc id="desc">Parse each original row, validate its shape and count, resolve duplicates or conflicts under an explicit policy, and record accepted-for-review, rejected or held disposition. No import directly adds reservable availability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="540" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 05  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Turn donor rows into auditable proposals</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="250,205 290,205" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,205 540,205" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,205 790,205" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="395,260 395,355" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="645,260 645,355" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="150" width="210" height="110" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Original CSV</tspan></text><text x="145.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Preserve record identity</tspan></text><rect x="290" y="150" width="210" height="110" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Parse + validate</tspan></text><text x="395.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Types, units and values</tspan></text><rect x="540" y="150" width="210" height="110" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Resolve conflicts</tspan></text><text x="645.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Use an agreed rule</tspan></text><rect x="790" y="150" width="210" height="110" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Proposal records</tspan></text><text x="895.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Await human review</tspan></text><rect x="330" y="355" width="430" height="120" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="545.0" y="387" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="545.0" dy="0">Audit every source record</tspan></text><text x="545.0" y="416" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="545.0" dy="0">Accepted for review / rejected / held</tspan><tspan x="545.0" dy="22.950000000000003">Reason and next action</tspan></text><text x="520" y="515" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">Valid syntax does not approve food or reserve a pickup.</tspan></text></g></svg>