<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">Separate a plan, its lines and offer identity</title><desc id="desc">A planning header has many plan lines; an offer batch may appear in many planning lines. Save a declared portions-per-container snapshot with each line. A stored plan is not yet an operational reservation or delivery.</desc>
