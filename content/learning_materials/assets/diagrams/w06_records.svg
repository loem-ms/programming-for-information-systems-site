<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="550" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 06  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Separate a plan, its lines and offer identity</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="230,265 230,320 420,320 420,365" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="176.0" y="288" width="108" height="24" rx="6" fill="#ffffff"/><text x="230" y="305" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="230" dy="0">One → many</tspan></text><polyline points="810,265 810,320 620,320 620,365" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="756.0" y="288" width="108" height="24" rx="6" fill="#ffffff"/><text x="810" y="305" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="810" dy="0">One → many</tspan></text><rect x="60" y="150" width="340" height="115" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="230.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="230.0" dy="0">Pickup plan</tspan></text><text x="230.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="230.0" dy="0">plan_id · planning status</tspan></text><rect x="640" y="150" width="340" height="115" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="810.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="810.0" dy="0">Offer batch</tspan></text><text x="810.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="810.0" dy="0">batch_id · declared description</tspan></text><rect x="310" y="365" width="420" height="125" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="520.0" y="397" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Plan line</tspan></text><text x="520.0" y="426" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">plan_id + batch_id + containers</tspan><tspan x="520.0" dy="22.950000000000003">Stored portions/container snapshot</tspan></text><text x="520" y="530" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">Python objects and database records require an explicit mapping.</tspan></text></g></svg>