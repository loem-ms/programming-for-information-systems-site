<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">main() runs only when you call it</title><desc id="desc">Running pickup_app.py gives it the name __main__ and calls the guarded main. Importing pickup_app creates its definitions but skips that guarded call. The importing caller can use planned_portions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="610" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">PYTHON FOUNDATIONS / ENTRY POINTS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">main() runs only when you call it</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="430,230 430,270 265,270 265,315" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="610,230 610,270 775,270 775,315" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="265,415 265,470" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="775,415 775,470" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="350" y="140" width="340" height="90" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="520.0" y="172" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">pickup_app.py</tspan></text><text x="520.0" y="201" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">Definitions + a guarded call</tspan></text><rect x="70" y="315" width="390" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="265.0" y="347" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="265.0" dy="0">Run the file</tspan></text><text x="265.0" y="376" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="265.0" dy="0">__name__ is &quot;__main__&quot;</tspan></text><rect x="580" y="315" width="390" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="775.0" y="347" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="775.0" dy="0">Import the module</tspan></text><text x="775.0" y="376" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="775.0" dy="0">__name__ is &quot;pickup_app&quot;</tspan></text><rect x="70" y="470" width="390" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="265.0" y="502" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="265.0" dy="0">Call main()</tspan></text><text x="265.0" y="531" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="265.0" dy="0">Choose inputs and print a plan</tspan></text><rect x="580" y="470" width="390" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="775.0" y="502" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="775.0" dy="0">Skip the guarded call</tspan></text><text x="775.0" y="531" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="775.0" dy="0">Caller may use planned_portions(...)</tspan></text></g></svg>