<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="545" viewBox="0 0 1040 545" role="img" aria-labelledby="title desc">
<title id="title">One Boolean condition selects a path</title><desc id="desc">A true condition runs the if body, a false condition the else body, then execution continues. An elif chain can test another condition after the first is false.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="545" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 02  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">One Boolean condition selects a path</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="415,190 270,190 270,300" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="293.0" y="163" width="54" height="24" rx="6" fill="#ffffff"/><text x="320" y="180" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="320" dy="0">True</tspan></text><polyline points="625,190 770,190 770,300" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="683.5" y="163" width="63" height="24" rx="6" fill="#ffffff"/><text x="715" y="180" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="715" dy="0">False</tspan></text><polyline points="270,400 270,472 370,472" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="770,400 770,472 670,472" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M520.0,135 L625,190.0 L520.0,245 L415,190.0 Z" fill="#fff4df" stroke="#986714" stroke-width="1.8"/><text x="520.0" y="185.0" text-anchor="middle" font-size="18" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Condition</tspan><tspan x="520.0" dy="24.3">is true?</tspan></text><rect x="165" y="300" width="210" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="270.0" y="332" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="270.0" dy="0">if body</tspan></text><text x="270.0" y="361" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="270.0" dy="0">Runs when true</tspan></text><rect x="665" y="300" width="210" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="770.0" y="332" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="770.0" dy="0">else body</tspan></text><text x="770.0" y="361" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="770.0" dy="0">Runs when false</tspan></text><rect x="370" y="440" width="300" height="65" rx="14" fill="#f2f5f8" stroke="#64748b" stroke-width="1.5"/><text x="520.0" y="472" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Continue after the block</tspan></text></g></svg>