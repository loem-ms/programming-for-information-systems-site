<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Separate the rule, startup and evidence</title><desc id="desc">The entry point parses and validates input then calls a reusable rule. Tests call the rule with independently expected results and can also check the complete command. Output and exit status belong to the command boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="560" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">PYTHON FOUNDATIONS / PROGRAM STRUCTURE</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Separate the rule, startup and evidence</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="300,205 390,205" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="650,205 740,205" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="520,255 520,380" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="870,380 870,255" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="40" y="155" width="260" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="170.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="170.0" dy="0">Command inputs</tspan></text><text x="170.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="170.0" dy="0">Arguments from the user</tspan></text><rect x="390" y="155" width="260" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="520.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">app.py · main()</tspan></text><text x="520.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">Parse, validate and call</tspan></text><rect x="740" y="155" width="260" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="870.0" y="187" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="870.0" dy="0">policy.py</tspan></text><text x="870.0" y="216" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="870.0" dy="0">Reusable rule + return value</tspan></text><rect x="390" y="380" width="260" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="520.0" y="412" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Result + status</tspan></text><text x="520.0" y="441" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">Display or explain failure</tspan></text><rect x="740" y="380" width="260" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="870.0" y="412" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="870.0" dy="0">test_policy.py</tspan></text><text x="870.0" y="441" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="870.0" dy="0">Independent expected cases</tspan></text><text x="175" y="420" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="175" dy="0">A rule returns data.</tspan><tspan x="175" dy="22.950000000000003">The entry point controls</tspan><tspan x="175" dy="22.950000000000003">the user interaction.</tspan></text><text x="695" y="530" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="695" dy="0">Test both useful results and relevant failure behavior.</tspan></text></g></svg>