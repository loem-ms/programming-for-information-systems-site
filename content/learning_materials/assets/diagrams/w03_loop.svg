<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">A running total, one contribution at a time</title><desc id="desc">Initialize the total once. For each line calculate its planned portions and add the contribution. An empty list leaves the agreed total at zero.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="650" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 03  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">A running total, one contribution at a time</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="520,220 520,270" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="625,325 745,325" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="667.0" y="296" width="36" height="24" rx="6" fill="#ffffff"/><text x="685" y="313" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="685" dy="0">No</tspan></text><polyline points="520,380 520,430" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="530.5" y="396" width="45" height="24" rx="6" fill="#ffffff"/><text x="553" y="413" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="553" dy="0">Yes</tspan></text><polyline points="520,515 520,550" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="370,592 200,592 200,325 415,325" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="370" y="135" width="300" height="85" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="520.0" y="167" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Start at zero</tspan></text><text x="520.0" y="196" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">total_portions = 0</tspan></text><path d="M520.0,270 L625,325.0 L520.0,380 L415,325.0 Z" fill="#fff4df" stroke="#986714" stroke-width="1.8"/><text x="520.0" y="320.0" text-anchor="middle" font-size="18" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Another line</tspan><tspan x="520.0" dy="24.3">available?</tspan></text><rect x="745" y="275" width="210" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="850.0" y="307" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="850.0" dy="0">Report total</tspan></text><text x="850.0" y="336" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="850.0" dy="0">Planned, not delivered</tspan></text><rect x="370" y="430" width="300" height="85" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="520.0" y="462" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Calculate contribution</tspan></text><text x="520.0" y="491" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">Portions/container × containers</tspan></text><rect x="370" y="550" width="300" height="85" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="520.0" y="582" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Add to total</tspan></text><text x="520.0" y="611" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="520.0" dy="0">Retain earlier contributions</tspan></text></g></svg>