<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">A pickup plan contains batch-line records</title><desc id="desc">A pickup plan holds several lines. Each records batch ID, portions per container and container count. A line count, container count and planned portion count answer different questions.</desc>
