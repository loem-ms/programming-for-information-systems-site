<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">A coordination rule needs precise boundaries</title><desc id="desc">Record the human review decision. Unreviewed requests are held. Reviewed requests of at least twenty planned portions use team coordination; smaller reviewed requests use standard coordination. The threshold does not certify food suitability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="640" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 02  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">A coordination rule needs precise boundaries</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="415,190 195,190 195,320" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="242.0" y="161" width="36" height="24" rx="6" fill="#ffffff"/><text x="260" y="178" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="260" dy="0">No</tspan></text><polyline points="625,190 780,190 780,320" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="682.5" y="161" width="45" height="24" rx="6" fill="#ffffff"/><text x="705" y="178" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="705" dy="0">Yes</tspan></text><polyline points="780,430 800,500" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="817.5" y="453" width="45" height="24" rx="6" fill="#ffffff"/><text x="840" y="470" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="840" dy="0">Yes</tspan></text><polyline points="650,375 420,375 420,500" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="512.0" y="346" width="36" height="24" rx="6" fill="#ffffff"/><text x="530" y="363" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="530" dy="0">No</tspan></text><path d="M520.0,135 L625,190.0 L520.0,245 L415,190.0 Z" fill="#fff4df" stroke="#986714" stroke-width="1.8"/><text x="520.0" y="185.0" text-anchor="middle" font-size="18" fill="#24364a" font-weight="650"><tspan x="520.0" dy="0">Coordinator</tspan><tspan x="520.0" dy="24.3">approved?</tspan></text><rect x="70" y="320" width="250" height="100" rx="14" fill="#fff0ed" stroke="#ae4d40" stroke-width="1.5"/><text x="195.0" y="352" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="195.0" dy="0">Hold</tspan></text><text x="195.0" y="381" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="195.0" dy="0">Ask coordinator</tspan></text><path d="M780.0,320 L910,375.0 L780.0,430 L650,375.0 Z" fill="#fff4df" stroke="#986714" stroke-width="1.8"/><text x="780.0" y="370.0" text-anchor="middle" font-size="18" fill="#24364a" font-weight="650"><tspan x="780.0" dy="0">Planned portions</tspan><tspan x="780.0" dy="24.3">at least 20?</tspan></text><rect x="650" y="500" width="300" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="800.0" y="532" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="800.0" dy="0">Team coordination</tspan></text><text x="800.0" y="561" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="800.0" dy="0">Reviewed, 20 or more</tspan></text><rect x="260" y="500" width="320" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="420.0" y="532" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="420.0" dy="0">Standard coordination</tspan></text><text x="420.0" y="561" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="420.0" dy="0">Reviewed, fewer than 20</tspan></text><text x="520" y="620" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">A workload label does not decide recipient priority or food suitability.</tspan></text></g></svg>