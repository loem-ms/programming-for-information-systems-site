<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">From a donor offer to a planning calculation</title><desc id="desc">A donor provides a container count and a declared portions-per-container estimate. Multiply them, label the planned quantity and compare by hand. This does not reserve or deliver food.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="450" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 01  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">From a donor offer to a planning calculation</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="250,200 290,200" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,200 540,200" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,200 790,200" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="645,250 645,310" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="150" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Donor offer</tspan></text><text x="145.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Declared quantities</tspan></text><rect x="290" y="150" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Explicit inputs</tspan></text><text x="395.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Portions × containers</tspan></text><rect x="540" y="150" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Python calculation</tspan></text><text x="645.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Multiply with units</tspan></text><rect x="790" y="150" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="182" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Planning result</tspan></text><text x="895.0" y="211" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Not a delivery event</tspan></text><rect x="540" y="310" width="210" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="645.0" y="342" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Check by hand</tspan></text><text x="645.0" y="371" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Expected vs observed</tspan></text><text x="275" y="360" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="275" dy="0">Ask what each container holds.</tspan><tspan x="275" dy="22.950000000000003">Unknown units need clarification.</tspan></text></g></svg>