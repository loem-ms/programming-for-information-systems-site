<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Same Python, different execution context</title><desc id="desc">A notebook sends selected cells to a persistent kernel. A terminal command starts a new Python process to execute a saved file, produce output and exit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="500" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">PYTHON FOUNDATIONS / EXECUTION</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Same Python, different execution context</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<rect x="25" y="130" width="990" height="150" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-dasharray="6 5"/><text x="45" y="159" text-anchor="start" font-size="16" fill="#526277" font-weight="650"><tspan x="45" dy="0">NOTEBOOK · variables remain until the kernel is reset</tspan></text><rect x="25" y="315" width="990" height="150" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-dasharray="6 5"/><text x="45" y="344" text-anchor="start" font-size="16" fill="#526277" font-weight="650"><tspan x="45" dy="0">SAVED PROGRAM · each command starts a fresh process</tspan></text><polyline points="250,217 290,217" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,217 540,217" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,217 790,217" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="250,402 290,402" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,402 540,402" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,402 790,402" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="175" width="210" height="85" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="207" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Code cells</tspan></text><text x="145.0" y="236" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Choose a cell to run</tspan></text><rect x="290" y="175" width="210" height="85" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="207" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Python kernel</tspan></text><text x="395.0" y="236" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Run the selected code</tspan></text><rect x="540" y="175" width="210" height="85" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="207" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Remembered state</tspan></text><text x="645.0" y="236" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Variables stay available</tspan></text><rect x="790" y="175" width="210" height="85" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="207" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Visible output</tspan></text><text x="895.0" y="236" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">May be from an older run</tspan></text><rect x="40" y="360" width="210" height="85" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="145.0" y="392" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Terminal command</tspan></text><text x="145.0" y="421" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">python pickup_app.py</tspan></text><rect x="290" y="360" width="210" height="85" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="395.0" y="392" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Fresh process</tspan></text><text x="395.0" y="421" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Read the saved file</tspan></text><rect x="540" y="360" width="210" height="85" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="645.0" y="392" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Run saved code</tspan></text><text x="645.0" y="421" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Top to bottom</tspan></text><rect x="790" y="360" width="210" height="85" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="895.0" y="392" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Output + exit</tspan></text><text x="895.0" y="421" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Files may remain</tspan></text></g></svg>