0" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="643.0" y="578" width="144" height="24" rx="6" fill="#ffffff"/><text x="715" y="595" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="715" dy="0">Invalid fields</tspan></text><polyline points="895,620 895,700" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="887.0" y="658" width="126" height="24" rx="6" fill="#ffffff"/><text x="950" y="675" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="950" dy="0">Valid fields</tspan></text><polyline points="790,750 380,750" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="512.5" y="718" width="135" height="24" rx="6" fill="#ffffff"/><text x="580" y="735" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="580" dy="0">Choose action</tspan></text><polyline points="440,440 440,650 230,650 230,700" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Donor message</tspan></text><text x="145.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Preserve the source</tspan></text><rect x="290" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">POST JSON</tspan></text><text x="395.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Client request</tspan></text><rect x="540" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Local replay</tspan></text><text x="645.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Authored fixtures</tspan></text><rect x="790" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Request outcome</tspan></text><text x="895.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Status or exception</tspan></text><rect x="790" y="340" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="372" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Parse JSON</tspan></text><text x="895.0" y="401" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Read the JSON value</tspan></text><rect x="290" y="340" width="300" height="100" rx="14" fill="#fff0ed" stroke="#ae4d40" stroke-width="1.5"/><text x="440.0" y="372" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="440.0" dy="0">Follow up</tspan></text><text x="440.0" y="401" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="440.0" dy="0">Record failure + next action</tspan></text><rect x="790" y="520" width="210" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="895.0" y="552" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Validate fields</tspan></text><text x="895.0" y="581" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Types · ranges · units</tspan></text><rect x="790" y="700" width="210" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="895.0" y="732" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Compare meaning</tspan></text><text x="895.0" y="761" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Candidate vs source</tspan></text><rect x="80" y="700" width="300" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="230.0" y="732" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="230.0" dy="0">Review action</tspan></text><text x="230.0" y="761" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="230.0" dy="0">Proposal or follow-up</tspan></text><text x="520" y="850" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">Every failure path records a reason and next action.</tspan><tspan x="520" dy="22.950000000000003">A successful response is not coordinator approval.</tspan></text></g></svg>