<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">Reserve the whole pickup or undo every change</title><desc id="desc">Within one transaction, check the request, decrement reservable containers and insert a reservation with lines. Normal exit commits. If review or availability checks fail, an escaping exception rolls back all partial changes. Neither outcome proves collection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="610" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 07  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Reserve the whole pickup or undo every change</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<rect x="40" y="130" width="960" height="230" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-dasharray="6 5"/><text x="60" y="159" text-anchor="start" font-size="16" fill="#526277" font-weight="650"><tspan x="60" dy="0">TRANSACTION BOUNDARY · one complete request</tspan></text><polyline points="335,245 405,245" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="535,295 535,390 290,390 290,440" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="241.5" y="362" width="117" height="24" rx="6" fill="#ffffff"/><text x="300" y="379" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="300" dy="0">Normal exit</tspan></text><polyline points="535,295 535,390 750,390 750,440" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="673.5" y="362" width="153" height="24" rx="6" fill="#ffffff"/><text x="750" y="379" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="750" dy="0">Failure escapes</tspan></text><rect x="75" y="195" width="260" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="205.0" y="227" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="205.0" dy="0">Check + begin</tspan></text><text x="205.0" y="256" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="205.0" dy="0">Reviewed, positive lines</tspan></text><rect x="405" y="195" width="260" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="535.0" y="227" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="535.0" dy="0">Required writes</tspan></text><text x="535.0" y="256" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="535.0" dy="0">Availability + records</tspan></text><rect x="120" y="440" width="340" height="115" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="290.0" y="472" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="290.0" dy="0">Commit</tspan></text><text x="290.0" y="501" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="290.0" dy="0">Whole reservation saved</tspan></text><rect x="580" y="440" width="340" height="115" rx="14" fill="#fff0ed" stroke="#ae4d40" stroke-width="1.5"/><text x="750.0" y="472" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="750.0" dy="0">Roll back</tspan></text><text x="750.0" y="501" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="750.0" dy="0">All state unchanged</tspan></text><text x="520" y="595" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">Catch expected failure after the transaction has rolled back.</tspan></text></g></svg>