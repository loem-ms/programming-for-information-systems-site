<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc">
<title id="title">What survives when a program stops?</title><desc id="desc">An in-memory database disappears when its connection closes. A committed file database can be reopened through a new connection or process using the same file path. Public class attributes alone are not persistence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="530" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 06  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">What survives when a program stops?</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<rect x="35" y="135" width="465" height="330" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-dasharray="6 5"/><text x="55" y="164" text-anchor="start" font-size="16" fill="#526277" font-weight="650"><tspan x="55" dy="0">MEMORY · :memory:</tspan></text><rect x="540" y="135" width="465" height="330" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-dasharray="6 5"/><text x="560" y="164" text-anchor="start" font-size="16" fill="#526277" font-weight="650"><tspan x="560" dy="0">FILE · explicit database path</tspan></text><polyline points="265,295 265,345" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="770,295 770,345" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="75" y="195" width="380" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="265.0" y="227" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="265.0" dy="0">Run + connection</tspan></text><text x="265.0" y="256" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="265.0" dy="0">Temporary records</tspan></text><rect x="75" y="345" width="380" height="90" rx="14" fill="#fff0ed" stroke="#ae4d40" stroke-width="1.5"/><text x="265.0" y="377" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="265.0" dy="0">Close connection</tspan></text><text x="265.0" y="406" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="265.0" dy="0">That database is gone</tspan></text><rect x="580" y="195" width="380" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="770.0" y="227" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="770.0" dy="0">Write and commit</tspan></text><text x="770.0" y="256" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="770.0" dy="0">Database file remains</tspan></text><rect x="580" y="345" width="380" height="90" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="770.0" y="377" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="770.0" dy="0">Reopen the same file</tspan></text><text x="770.0" y="406" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="770.0" dy="0">Read the saved plan</tspan></text><text x="520" y="510" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">Current directory and script directory can point to different files.</tspan></text></g></svg>