<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
<title id="title">Optional improvement: a testable agreement</title><desc id="desc">Optional after baseline reproduction: start from a volunteer or partner need, agree on observable outcomes and then implement. Run acceptance and regression tests, collect peer evidence and revise with a reason.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7c8e"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1040" height="520" rx="20" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" font-size="13" fill="#217565" font-weight="650"><tspan x="40" dy="0">WEEK 09  /  PROGRAMMING FOR INFORMATION SYSTEMS</tspan></text>
<text x="40" y="78" text-anchor="start" font-size="30" fill="#183047" font-weight="650"><tspan x="40" dy="0">Optional improvement: a testable agreement</tspan></text>
<path d="M40,103 H1000" stroke="#dce5ed"/>
<polyline points="250,195 290,195" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="500,195 540,195" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="750,195 790,195" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="895,245 895,345" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="790,395 750,395" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="540,395 500,395" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="395,345 395,245" fill="none" stroke="#6b7c8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="309.5" y="283" width="171" height="24" rx="6" fill="#ffffff"/><text x="395" y="300" text-anchor="middle" font-size="16" fill="#6b7c8e" font-weight="400"><tspan x="395" dy="0">Recheck agreement</tspan></text><rect x="40" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="145.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="145.0" dy="0">Stakeholder need</tspan></text><text x="145.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="145.0" dy="0">Who needs a decision?</tspan></text><rect x="290" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="395.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Agreed behavior</tspan></text><text x="395.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Define acceptance</tspan></text><rect x="540" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="645.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Predicted cases</tspan></text><text x="645.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Freeze expectations</tspan></text><rect x="790" y="145" width="210" height="100" rx="14" fill="#edf4ff" stroke="#426aab" stroke-width="1.5"/><text x="895.0" y="177" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Small change</tspan></text><text x="895.0" y="206" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Implement the proposal</tspan></text><rect x="790" y="345" width="210" height="100" rx="14" fill="#e8f6f1" stroke="#217565" stroke-width="1.5"/><text x="895.0" y="377" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="895.0" dy="0">Run tests</tspan></text><text x="895.0" y="406" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="895.0" dy="0">Acceptance + regression</tspan></text><rect x="540" y="345" width="210" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="645.0" y="377" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="645.0" dy="0">Review evidence</tspan></text><text x="645.0" y="406" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="645.0" dy="0">Peer inputs + observations</tspan></text><rect x="290" y="345" width="210" height="100" rx="14" fill="#fff4df" stroke="#986714" stroke-width="1.5"/><text x="395.0" y="377" text-anchor="middle" font-size="20" fill="#24364a" font-weight="650"><tspan x="395.0" dy="0">Revise with a reason</tspan></text><text x="395.0" y="406" text-anchor="middle" font-size="17" fill="#24364a" font-weight="400"><tspan x="395.0" dy="0">Rule or implementation</tspan></text><text x="520" y="490" text-anchor="middle" font-size="17" fill="#526277" font-weight="400"><tspan x="520" dy="0">Do not change an expectation merely to make a test pass.</tspan></text></g></svg>